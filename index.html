ge", "id": "im-w6-e14cfd0ca2fe", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A column representing a property", "opts": ["Foreign key", "Composite key", "Candidate key", "Attribute"], "a": 3, "e": "Attribute: A column representing a property", "source": "PDF lesson coverage", "id": "im-w6-ca834ba03839", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The number of attributes or columns in a relation", "opts": ["Referential integrity", "Key constraint", "Degree", "Domain constraint"], "a": 2, "e": "Degree: The number of attributes or columns in a relation", "source": "PDF lesson coverage", "id": "im-w6-c34e177bd375", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The number of tuples or rows in a relation", "opts": ["Cardinality", "Superkey", "Alternate key", "Relation schema"], "a": 0, "e": "Cardinality: The number of tuples or rows in a relation", "source": "PDF lesson coverage", "id": "im-w6-6a066ea8417c", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The set of allowable values for an attribute", "opts": ["Domain constraint", "Referential integrity", "Degree", "Attribute domain"], "a": 3, "e": "Attribute domain: The set of allowable values for an attribute", "source": "PDF lesson coverage", "id": "im-w6-1e9a4225a539", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The relation's name together with its attributes", "opts": ["Alternate key", "Relation schema", "Key constraint", "Referential integrity"], "a": 1, "e": "Relation schema: The relation's name together with its attributes", "source": "PDF lesson coverage", "id": "im-w6-5477e2944600", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A finite set of tuples currently held in a relation", "opts": ["Relation instance", "Primary key", "Candidate key", "Relation schema"], "a": 0, "e": "Relation instance: A finite set of tuples currently held in a relation", "source": "PDF lesson coverage", "id": "im-w6-6e4d3ea3adf5", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Any attribute set that uniquely identifies a tuple, possibly with extra attributes", "opts": ["Cardinality", "Alternate key", "Superkey", "Relation instance"], "a": 2, "e": "Superkey: Any attribute set that uniquely identifies a tuple, possibly with extra attributes", "source": "PDF lesson coverage", "id": "im-w6-125152112eed", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A minimal superkey with no unnecessary attribute", "opts": ["Candidate key", "Key constraint", "Cardinality", "Junction table"], "a": 0, "e": "Candidate key: A minimal superkey with no unnecessary attribute", "source": "PDF lesson coverage", "id": "im-w6-690b96b6d74d", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The selected candidate key, with unique and non-null values", "opts": ["Relation instance", "Primary key", "Foreign key", "Attribute domain"], "a": 1, "e": "Primary key: The selected candidate key, with unique and non-null values", "source": "PDF lesson coverage", "id": "im-w6-0328463a4562", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A candidate key not chosen as the primary key", "opts": ["Referential integrity", "Alternate key", "Attribute domain", "Superkey"], "a": 1, "e": "Alternate key: A candidate key not chosen as the primary key", "source": "PDF lesson coverage", "id": "im-w6-479ae82f5212", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A key containing more than one attribute", "opts": ["Alternate key", "Composite key", "Referential integrity", "Attribute"], "a": 1, "e": "Composite key: A key containing more than one attribute", "source": "PDF lesson coverage", "id": "im-w6-a516b000745b", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A column or column set referencing a key of another or the same relation", "opts": ["Foreign key", "Relation", "Tuple", "Cardinality"], "a": 0, "e": "Foreign key: A column or column set referencing a key of another or the same relation", "source": "PDF lesson coverage", "id": "im-w6-51f98c887386", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The rule enforcing uniqueness of identifiers, with non-null primary keys", "opts": ["Domain constraint", "Referential integrity", "Cardinality", "Key constraint"], "a": 3, "e": "Key constraint: The rule enforcing uniqueness of identifiers, with non-null primary keys", "source": "PDF lesson coverage", "id": "im-w6-8f4121ad332c", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A rule restricting values to an attribute's allowed domain", "opts": ["Foreign key", "Cardinality", "Domain constraint", "Relation instance"], "a": 2, "e": "Domain constraint: A rule restricting values to an attribute's allowed domain", "source": "PDF lesson coverage", "id": "im-w6-173130d3f4b5", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The requirement that non-null foreign-key values have matching referenced keys", "opts": ["Cardinality", "Candidate key", "Domain constraint", "Referential integrity"], "a": 3, "e": "Referential integrity: The requirement that non-null foreign-key values have matching referenced keys", "source": "PDF lesson coverage", "id": "im-w6-96239e42eeba", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A relation storing links between entities in a many-to-many relationship", "opts": ["Relation schema", "Alternate key", "Superkey", "Junction table"], "a": 3, "e": "Junction table: A relation storing links between entities in a many-to-many relationship", "source": "PDF lesson coverage", "id": "im-w6-1c7dca11c705", "kind": "recall"}, {"t": "mc", "q": "A relation has columns Student_ID, Name, Course and four rows (101 Ana BSIT; 102 Carlo BSCS; 103 Bea BSIT; 104 Mark BSIS). What are its degree and cardinality, respectively?", "opts": ["Degree 4; cardinality 3", "Degree 3; cardinality 4", "Degree 3; cardinality 3", "Degree 4; cardinality 4"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q11 · PDF p.89", "originalLetter": "B", "e": "Degree counts columns (3); cardinality counts rows (4).", "id": "im-w6-322cc44a3433"}, {"t": "mc", "q": "In the relational model, what term refers to a single row in a relation?", "opts": ["Attribute", "Domain", "Tuple", "Schema"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 2 · Q12 · PDF p.89", "originalLetter": "C", "e": "A tuple is a row; an attribute is a column.", "id": "im-w6-a14e3fc07641"}, {"t": "mc", "q": "STUDENT has Student_ID, School_Email, Name. Both Student_ID and School_Email are individually unique and NOT NULL. Which statement is correct?", "opts": ["Both Student_ID and School_Email can be candidate keys.", "Only Student_ID can be a superkey.", "Both must be combined to form the only candidate key.", "School_Email cannot be a candidate key because it contains text."], "a": 0, "kind": "sample", "source": "Provided answer key · Set 2 · Q13 · PDF p.90", "originalLetter": "A", "e": "Each alone minimally identifies a row; data type does not disqualify email.", "id": "im-w6-339769c2a9be"}, {"t": "mc", "q": "Student_ID uniquely identifies every student. Which is a superkey but NOT a candidate key?", "opts": ["Student_ID", "Student_ID and Student_Name", "Student_Name, when names may repeat", "Course, when several students may take the same course"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q14 · PDF p.90", "originalLetter": "B", "e": "The combined set identifies rows but Student_Name is unnecessary, so it is not minimal.", "id": "im-w6-84306d068e90"}, {"t": "mc", "q": "Student_ID is selected as primary key although School_Email is also a candidate key. What is School_Email called relative to the chosen primary key?", "opts": ["Foreign key", "Composite key", "Alternate key", "Partial key"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 2 · Q15 · PDF p.90", "originalLetter": "C", "e": "An unselected candidate key is an alternate key.", "id": "im-w6-bd50a9043563"}, {"t": "mc", "q": "STUDENT.student_id is INT PRIMARY KEY and row 2026001 already exists. What happens with INSERT INTO student (student_id) VALUES (2026001);", "opts": ["Existing row automatically updated", "Second row inserted because ID is numeric", "Statement rejected because primary key already exists", "Statement accepted but new primary key becomes NULL"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 2 · Q16 · PDF p.90", "originalLetter": "C", "e": "A primary key cannot be duplicated.", "id": "im-w6-255dadcbea8e"}, {"t": "mc", "q": "For CHECK (year_level BETWEEN 1 AND 4), which value satisfies the constraint?", "opts": ["0", "4", "5", "-1"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q17 · PDF p.91", "originalLetter": "B", "e": "BETWEEN includes both endpoints, so 4 is accepted.", "id": "im-w6-f99a41cb36ba"}, {"t": "mc", "q": "Column gender is CHAR(1) NOT NULL with CHECK (gender IN ('M','F')). Which statement is correct?", "opts": ["M, F, and NULL are accepted", "Only M and F are accepted", "Any single character is accepted", "Male and Female are accepted because their first letters match"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q18 · PDF p.91", "originalLetter": "B", "e": "The declared domain permits M or F and excludes NULL.", "id": "im-w6-b95183336401"}, {"t": "mc", "q": "A mobile number must contain exactly 11 numeric digits. Which CHECK best enforces this?", "opts": ["CHECK (mobile_number > 11)", "CHECK (CHAR_LENGTH(mobile_number) <= 11)", "CHECK (CHAR_LENGTH(mobile_number) = 11 AND mobile_number REGEXP '^[0-9]{11}$')", "CHECK (mobile_number IS NOT NULL)"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 2 · Q19 · PDF p.91", "originalLetter": "C", "e": "Length and digit checks are both needed; use NOT NULL separately if a value is required.", "id": "im-w6-0b56b6351d7c"}, {"t": "mc", "q": "STUDENT.student_id is a PK and contains 101,102. REGISTRATION.student_id is a NOT NULL FK referencing STUDENT. Which value can be inserted without violating referential integrity?", "opts": ["100", "101", "103", "NULL"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q20 · PDF p.91", "originalLetter": "B", "e": "101 exists in the referenced keys; NULL is explicitly disallowed here.", "id": "im-w6-779be29f33cf"}, {"t": "mc", "q": "A student can have multiple contact numbers. Which relational design best converts this attribute?", "opts": ["STUDENT(student_id, mobile_1, mobile_2, mobile_3)", "STUDENT(student_id, mobile_numbers), numbers comma-separated", "STUDENT(student_id, ...); STUDENT_CONTACT(student_id, mobile_number), composite PK and FK", "STUDENT_CONTACT(mobile_number), no connection to STUDENT"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 2 · Q21 · PDF p.91", "originalLetter": "C", "e": "A separate contact relation stores one number per row and links it to its student.", "id": "im-w6-c9375ac54b5f"}, {"t": "mc", "q": "REGISTRATION rows: REG001/101/EVT001/Registered; REG002/102/EVT001/Attended; REG003/101/EVT002/Registered; REG004/103/EVT002/Absent. What does SELECT COUNT(*) FROM registration WHERE student_id = 101; return?", "opts": ["1", "2", "3", "4"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q22 · PDF p.92", "originalLetter": "B", "e": "REG001 and REG003 match student 101.", "id": "im-w6-96f0c7ce6855"}, {"t": "mc", "q": "Using rows REG001/101/Registered; REG002/102/Attended; REG003/101/Registered; REG004/103/Absent, what does SELECT registration_id FROM registration WHERE status = 'Registered' ORDER BY registration_id; return?", "opts": ["REG001 and REG003", "REG001 and REG002", "REG002 and REG004", "REG003 and REG004"], "a": 0, "kind": "sample", "source": "Provided answer key · Set 2 · Q23 · PDF p.92", "originalLetter": "A", "e": "Only REG001 and REG003 have the specified status.", "id": "im-w6-5ee7eb0cbf63"}, {"t": "mc", "q": "Starting with REG001 Registered, REG002 Attended, REG003 Registered, REG004 Absent: UPDATE registration SET status = 'Attended' WHERE registration_id = 'REG001'; DELETE FROM registration WHERE registration_id = 'REG004'; SELECT COUNT(*) FROM registration WHERE status = 'Attended'; What is returned?", "opts": ["1", "2", "3", "4"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q24 · PDF p.92", "originalLetter": "B", "e": "REG001 becomes Attended; REG002 already is Attended; REG004 is deleted.", "id": "im-w6-162f961093cb"}, {"t": "mc", "q": "Given STUDENT(student_id,student_name), EVENT(event_no,event_name), REGISTRATION(registration_id,student_id,event_no), which query correctly displays each student name with the name of the event they registered for?", "opts": ["SELECT student_name, event_name FROM student JOIN event ON student.student_id = event.event_no;", "SELECT student_name, event_name FROM student JOIN registration ON student.student_id = registration.student_id JOIN event ON registration.event_no = event.event_no;", "SELECT student_name, event_name FROM registration JOIN event ON registration.student_id = event.event_no;", "SELECT student_name, event_name FROM student JOIN registration ON student.student_id = registration.event_no;"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 2 · Q25 · PDF p.93", "originalLetter": "B", "e": "Use the registration bridge: join by student_id, then by event_no.", "id": "im-w6-ee03ef5d2863"}, {"t": "mc", "q": "A table has 6 columns and 12 rows. What are its degree and cardinality?", "opts": ["Degree 6; cardinality 12", "Degree 18; cardinality 6", "Degree 6; cardinality 6", "Degree 12; cardinality 6"], "a": 0, "e": "Degree counts attributes; cardinality counts tuples.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-6d996c3cd294"}, {"t": "mc", "q": "A student_id primary key receives NULL. What should happen?", "opts": ["Accept because NULL is unique", "Treat NULL as zero", "Replace all IDs automatically", "Reject the row"], "a": 3, "e": "Primary keys must not be NULL.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-77a490af0d37"}, {"t": "mc", "q": "A foreign key is nullable. Which value is allowed by referential integrity alone?", "opts": ["NULL or an existing referenced key", "Only a key absent from the parent", "Any duplicated parent name", "Any arbitrary non-null key"], "a": 0, "e": "A nullable FK may be NULL; non-null values need a referenced match.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-fd087f9f6038"}, {"t": "mc", "q": "A FK column is declared NOT NULL. May it use NULL because FKs sometimes permit it?", "opts": ["Yes if it is numeric", "Yes if the parent has one row", "Yes; all FKs must allow NULL", "No; NOT NULL still applies"], "a": 3, "e": "Referential and nullability constraints both apply.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-24ceda38fea2"}, {"t": "mc", "q": "Student_ID alone uniquely identifies rows. Which set is minimal?", "opts": ["Student_ID", "Student_ID plus Course", "Student_ID plus all other fields", "Student_ID plus Name"], "a": 0, "e": "A candidate key has no unnecessary attribute.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-ea74b053e501"}, {"t": "mc", "q": "An entity has first, middle and last name components. How should its composite name map to a table?", "opts": ["Omit the name entirely", "Create a column per character", "Store each component as a separate unrelated entity", "Store the components as separate columns"], "a": 3, "e": "Composite attributes are commonly flattened to their simple components.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-13b4c1517608"}, {"t": "mc", "q": "A STUDENT and COURSE relationship is many-to-many. Which mapping is appropriate?", "opts": ["ENROLLMENT with student_id and course_id foreign keys", "A single course_id that limits each student to one course", "Use student_name as course_id", "No links between their tables"], "a": 0, "e": "A bridge relation records each student-course association.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-3a4ddaf9a103"}, {"t": "mc", "q": "An UPDATE has no WHERE clause. Which rows are candidates to change?", "opts": ["Only the last row", "All rows in the table", "Only the first row", "No rows because WHERE is mandatory"], "a": 1, "e": "A WHERE clause restricts affected rows; without it all rows are targeted.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-301029f8ffeb"}, {"t": "mc", "q": "A phone number starts with zero. Which storage choice preserves formatting?", "opts": ["A date type", "A Boolean", "A numeric type that discards leading zeros", "A suitable character type"], "a": 3, "e": "Phone numbers are identifiers, not quantities used for arithmetic.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-4da68c3246a5"}, {"t": "mc", "q": "A relation stores one phone per student-contact row. Which key can prevent duplicate numbers per student?", "opts": ["student_id alone if many numbers are needed", "The phone's first digit", "student_id plus mobile_number", "The student's course alone"], "a": 2, "e": "The pair distinguishes each number within a student.", "kind": "situational", "source": "PDF-based practice", "id": "im-w6-c58f422afbd4"}]}, {"id": "im-w7", "subject": "im", "week": "Weeks 7–8 · Part 1", "title": "Normalization, Anomalies and Dependencies", "questions": [{"t": "mc", "q": "Which term matches this definition? Organizing relations to reduce redundancy and prevent anomalies", "opts": ["Prime attribute", "Normalization", "Non-prime attribute", "Insertion anomaly"], "a": 1, "e": "Normalization: Organizing relations to reduce redundancy and prevent anomalies", "source": "PDF lesson coverage", "id": "im-w7-8a4242a331e0", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Unnecessary repetition of stored facts", "opts": ["Functional dependency", "Redundancy", "Prime attribute", "Update anomaly"], "a": 1, "e": "Redundancy: Unnecessary repetition of stored facts", "source": "PDF lesson coverage", "id": "im-w7-10c36e435317", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Being unable to add one fact without supplying an unrelated fact", "opts": ["Full functional dependency", "Functional dependency", "Determinant", "Insertion anomaly"], "a": 3, "e": "Insertion anomaly: Being unable to add one fact without supplying an unrelated fact", "source": "PDF lesson coverage", "id": "im-w7-1fb714ef8d53", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A change to one fact requires updating many copies and may create inconsistency", "opts": ["Update anomaly", "Functional dependency", "Transitive dependency", "Full functional dependency"], "a": 0, "e": "Update anomaly: A change to one fact requires updating many copies and may create inconsistency", "source": "PDF lesson coverage", "id": "im-w7-6241651b1ef6", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Deleting one fact accidentally removes information about another", "opts": ["Update anomaly", "Determinant", "Deletion anomaly", "Partial dependency"], "a": 2, "e": "Deletion anomaly: Deleting one fact accidentally removes information about another", "source": "PDF lesson coverage", "id": "im-w7-454d235261b6", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A relationship A → B where one A value determines exactly one B value", "opts": ["Redundancy", "Transitive dependency", "Functional dependency", "Dependent"], "a": 2, "e": "Functional dependency: A relationship A → B where one A value determines exactly one B value", "source": "PDF lesson coverage", "id": "im-w7-7615ea0bb0e8", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The left-hand attribute set in a functional dependency", "opts": ["Determinant", "Partial dependency", "Update anomaly", "Functional dependency"], "a": 0, "e": "Determinant: The left-hand attribute set in a functional dependency", "source": "PDF lesson coverage", "id": "im-w7-c979eae1e0eb", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The right-hand attribute set in a functional dependency", "opts": ["Determinant", "Dependent", "Normalization", "Full functional dependency"], "a": 1, "e": "Dependent: The right-hand attribute set in a functional dependency", "source": "PDF lesson coverage", "id": "im-w7-9fdd8af83db4", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A dependency through an intermediate attribute, A → B → C", "opts": ["Full functional dependency", "Update anomaly", "Redundancy", "Transitive dependency"], "a": 3, "e": "Transitive dependency: A dependency through an intermediate attribute, A → B → C", "source": "PDF lesson coverage", "id": "im-w7-d6d3e1fbb77a", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A non-prime attribute depends on only part of a composite candidate key", "opts": ["Functional dependency", "Partial dependency", "Insertion anomaly", "Redundancy"], "a": 1, "e": "Partial dependency: A non-prime attribute depends on only part of a composite candidate key", "source": "PDF lesson coverage", "id": "im-w7-59fa0a13d20d", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? An attribute depends on the entire determinant and not a proper subset", "opts": ["Full functional dependency", "Insertion anomaly", "Deletion anomaly", "Normalization"], "a": 0, "e": "Full functional dependency: An attribute depends on the entire determinant and not a proper subset", "source": "PDF lesson coverage", "id": "im-w7-ff11a93884c2", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? An attribute belonging to at least one candidate key", "opts": ["Prime attribute", "Functional dependency", "Non-prime attribute", "Redundancy"], "a": 0, "e": "Prime attribute: An attribute belonging to at least one candidate key", "source": "PDF lesson coverage", "id": "im-w7-50724356dc6e", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? An attribute belonging to no candidate key", "opts": ["Non-prime attribute", "Prime attribute", "Redundancy", "Full functional dependency"], "a": 0, "e": "Non-prime attribute: An attribute belonging to no candidate key", "source": "PDF lesson coverage", "id": "im-w7-6a709785dc4a", "kind": "recall"}, {"t": "mc", "q": "A new course cannot be stored until at least one student enrolls because course facts occur only in enrollment rows. What problem is shown?", "opts": ["Schema independence", "Deletion anomaly", "Insertion anomaly", "Durability"], "a": 2, "e": "The design ties an independent course fact to an unrelated enrollment fact.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-8555f49225cf"}, {"t": "mc", "q": "A department head's name appears in twenty student rows. A change updates only ten copies. What problem is shown?", "opts": ["Insertion anomaly only", "A valid candidate key", "Update anomaly", "Isolation"], "a": 2, "e": "Updating repeated facts incompletely creates inconsistent copies.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-fcef110290ea"}, {"t": "mc", "q": "Deleting the last enrolled student also removes the only record of a course's title. What problem is shown?", "opts": ["Insertion anomaly", "Physical independence", "Atomicity necessarily", "Deletion anomaly"], "a": 3, "e": "Removing one entity's data loses another entity's fact.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-dd3e1b0fde68"}, {"t": "mc", "q": "Student_ID → Student_Name is known. Which side is the determinant?", "opts": ["Neither", "Student_ID", "Student_Name", "Both necessarily dependents"], "a": 1, "e": "The left-hand side determines the right-hand side.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-09a27bd8a2c9"}, {"t": "mc", "q": "Two rows have the same Student_ID but different Student_Name values. Which stated dependency is violated?", "opts": ["Student_ID → Student_Name", "No dependency", "Student_Name → Course_ID if not stated", "Every possible dependency"], "a": 0, "e": "A determinant cannot map to two different dependent values in a valid state.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-642540f9db81"}, {"t": "mc", "q": "Student_ID → Dept_Code and Dept_Code → Dept_Head. How does Student_ID determine Dept_Head?", "opts": ["As a repeating group", "Only by a partial dependency", "Transitively", "Not at all"], "a": 2, "e": "The value is determined through the intermediate department code.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-1175ce3fe973"}, {"t": "mc", "q": "The key is (Student_ID, Course_ID); Student_Name depends on Student_ID alone. Which dependency is present?", "opts": ["Partial dependency", "No dependency", "Full dependency on the whole key", "Only physical independence"], "a": 0, "e": "A non-prime attribute depends on a proper subset of the composite key.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-399e5c976487"}, {"t": "mc", "q": "The key is (Student_ID, Course_ID), and Grade depends on both. Which dependency is present?", "opts": ["Only a derived attribute", "Full functional dependency", "No functional dependency", "Partial dependency necessarily"], "a": 1, "e": "A grade belongs to a specific student-course pair.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-6e92ed0e8af6"}, {"t": "mc", "q": "Student_ID and unique Email are separate candidate keys. Is Email a prime attribute?", "opts": ["Yes, because it belongs to a candidate key", "No, because it is text", "No, because it was not selected as primary key", "Only if it is numeric"], "a": 0, "e": "Prime means part of any candidate key, not only the chosen primary key.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-4e6152bac0fe"}, {"t": "mc", "q": "A designer proposes that Course_ID determines Student_ID, although courses allow many students. Is that FD justified?", "opts": ["No; one course can correspond to several students", "Yes; every relationship is an FD both ways", "Yes; any FK determines all other fields", "Yes; names determine IDs"], "a": 0, "e": "A determinant must yield a single value for its dependent.", "kind": "situational", "source": "PDF-based practice", "id": "im-w7-6bd6b5458b06"}]}, {"id": "im-w8", "subject": "im", "week": "Weeks 7–8 · Part 2", "title": "1NF, 2NF and 3NF Applications", "questions": [{"t": "mc", "q": "Which term matches this definition? A relation with atomic, single-valued attributes and identifiable rows", "opts": ["Whole-key dependency", "First Normal Form", "Dependency preservation", "Third Normal Form"], "a": 1, "e": "First Normal Form: A relation with atomic, single-valued attributes and identifiable rows", "source": "PDF lesson coverage", "id": "im-w8-2d152dbbe90b", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A 1NF relation with no non-prime attribute partially dependent on a candidate key", "opts": ["Whole-key dependency", "Second Normal Form", "Lossless decomposition", "Third Normal Form"], "a": 1, "e": "Second Normal Form: A 1NF relation with no non-prime attribute partially dependent on a candidate key", "source": "PDF lesson coverage", "id": "im-w8-5ea1a02edac3", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? For every nontrivial dependency X → A, X is a superkey or A is prime", "opts": ["First Normal Form", "Lossless decomposition", "Dependency preservation", "Third Normal Form"], "a": 3, "e": "Third Normal Form: For every nontrivial dependency X → A, X is a superkey or A is prime", "source": "PDF lesson coverage", "id": "im-w8-ea9a8a3a52f7", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Splitting a relation into smaller relations to improve its design", "opts": ["Second Normal Form", "Non-key transitive dependency", "Lossless decomposition", "Decomposition"], "a": 3, "e": "Decomposition: Splitting a relation into smaller relations to improve its design", "source": "PDF lesson coverage", "id": "im-w8-7730fdfe51c2", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Splitting relations so joining them reconstructs the original valid data without spurious tuples", "opts": ["Whole-key dependency", "Second Normal Form", "Dependency preservation", "Lossless decomposition"], "a": 3, "e": "Lossless decomposition: Splitting relations so joining them reconstructs the original valid data without spurious tuples", "source": "PDF lesson coverage", "id": "im-w8-45e9e57b7162", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Retaining the ability to enforce dependencies within the decomposed relations", "opts": ["First Normal Form", "Second Normal Form", "Dependency preservation", "Non-key transitive dependency"], "a": 2, "e": "Dependency preservation: Retaining the ability to enforce dependencies within the decomposed relations", "source": "PDF lesson coverage", "id": "im-w8-36f259b90711", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A non-prime attribute requires all attributes of a composite determinant", "opts": ["Decomposition", "Second Normal Form", "Whole-key dependency", "First Normal Form"], "a": 2, "e": "Whole-key dependency: A non-prime attribute requires all attributes of a composite determinant", "source": "PDF lesson coverage", "id": "im-w8-b2c9866693bd", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A non-key fact depends on another non-key fact rect competitor", "Primary research"], "a": 2, "e": "Direct competitor: A business offering a similar product to solve the same need", "source": "PDF lesson coverage", "id": "tech-c5-7d46ff7b157c", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? An alternative solving the same problem in a different way", "opts": ["Qualitative research", "Industry disruption", "Testable", "Indirect competitor"], "a": 3, "e": "Indirect competitor: An alternative solving the same problem in a different way", "source": "PDF lesson coverage", "id": "tech-c5-c959ce7cec95", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A business that may enter the market in the future", "opts": ["Testable", "Startup validation", "Market research", "Potential competitor"], "a": 3, "e": "Potential competitor: A business that may enter the market in the future", "source": "PDF lesson coverage", "id": "tech-c5-e740e54ce577", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A significant change in how an industry operates", "opts": ["Pivot", "Industry disruption", "Potential competitor", "Minimum"], "a": 1, "e": "Industry disruption: A significant change in how an industry operates", "source": "PDF lesson coverage", "id": "tech-c5-cd9a6059942c", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A business mainly delivering value and interacting with customers through digital channels", "opts": ["Minimum Viable Product", "Digital-first business model", "Indirect competitor", "Market research"], "a": 1, "e": "Digital-first business model: A business mainly delivering value and interacting with customers through digital channels", "source": "PDF lesson coverage", "id": "tech-c5-7bcdbfb0c7e2", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Analyzing very large or complex datasets for patterns and useful insights", "opts": ["Market research", "Big data analytics", "Testable", "Qualitative re  for(let idx=start;idx<end;idx++){
  const q=curQueue[idx];
  html+=`<div class="qcard" id="qc${idx}"><div class="qcard-meta"><span class="qtype-badge">${q.t==='mc'?'◉ Multiple Choice':'✏ Identification'}${q.kind==='situational'?' · Situation':q.kind==='sample'?' · Provided sample':''}</span><span class="qnum">Q${idx+1} / ${total}</span></div><div class="qlesson">${esc(SUBJECTS[q._sub].label)} · ${esc(q._week)} · ${esc(q._lt)}</div><div class="qtext" style="white-space:pre-wrap">${esc(q.q)}</div>${q.t==='mc'?renderMC(q,idx):renderID(q,idx)}<div class="feedback" id="fb${idx}"></div></div>`;
 }
 html+=pager(pages)+`<div class="qz-actions" id="qzActions"><button class="btn btn-pri" onclick="checkAll()">Check All Answers</button><button class="btn btn-sec" onclick="goToFirstUnanswered()">Find unanswered</button><button class="btn btn-sec" onclick="showHome()">← Home</button></div>`;
 document.getElementById('main').innerHTML=html;
 const main=document.getElementById('main');
 main.querySelectorAll('.opt').forEach(btn=>btn.addEventListener('click',()=>{
  if(checked)return;const idx=Number(btn.dataset.idx);curAnswers[idx]=Number(btn.dataset.opt);
  main.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-pressed','false');});btn.classList.add('sel');btn.setAttribute('aria-pressed','true');updateProg();
 }));
 main.querySelectorAll('.id-input').forEach(inp=>inp.addEventListener('input',()=>{if(!checked){curAnswers[Number(inp.dataset.idx)]=inp.value;updateProg();}}));
}
function pager(pages){return `<div class="qz-actions" style="margin:14px 0"><button class="btn btn-sec" onclick="goPage(${pageIndex-1})" ${pageIndex===0?'disabled':''}>← Previous</button><span>Page ${pageIndex+1} / ${pages}</span><button class="btn btn-sec" onclick="goPage(${pageIndex+1})" ${pageIndex>=pages-1?'disabled':''}>Next →</button></div>`;}
function goPage(p){const pages=Math.ceil(curQueue.length/PAGE_SIZE);if(p<0||p>=pages)return;pageIndex=p;pendingGrade=false;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});}
function goToFirstUnanswered(){const idx=curAnswers.findIndex(a=>!isAnswered(a));if(idx<0){showNotice('Every question has an answer. You can check the round.');return;}pageIndex=Math.floor(idx/PAGE_SIZE);renderQuiz();document.getElementById('qc'+idx)?.scrollIntoView({behavior:'smooth',block:'center'});}
function renderMC(q,idx){return `<ul class="opts">${q.opts.map((o,oi)=>`<li><button class="opt ${curAnswers[idx]===oi?'sel':''}" data-idx="${idx}" data-opt="${oi}" aria-pressed="${curAnswers[idx]===oi}"><span class="opt-circle"></span><span style="white-space:pre-wrap">${String.fromCharCode(65+oi)}. ${esc(o)}</span></button></li>`).join('')}</ul>`;}
function renderID(q,idx){return `<div class="id-wrap"><label class="id-label" for="answer${idx}">Type your answer:</label><input class="id-input" id="answer${idx}" type="text" data-idx="${idx}" value="${esc(curAnswers[idx]??'')}" placeholder="Your answer…" autocomplete="off" spellcheck="false"><span class="id-hint">Case does not matter. Use the complete term or an accepted acronym.</span></div>`;}
function updateProg(){const total=curQueue.length,answered=curAnswers.filter(isAnswered).length,pct=Math.round(answered/total*100);document.getElementById('progFill').style.width=pct+'%';document.getElementById('progTxt').textContent=`Answered: ${answered} / ${total}`;document.getElementById('progPct').textContent=pct+'%';}
function checkAll(includeUnanswered=false){
 if(checked||!curQueue.length)return;
 const blanks=curAnswers.filter(a=>!isAnswered(a)).length;
 if(blanks&&!includeUnanswered){
  if(!pendingGrade){pendingGrade=true;const div=document.createElement('div');div.className='retry-banner';div.id='unansweredWarning';div.innerHTML=`<div>${blanks} unanswered question(s) remain. Complete them or grade now and include them in retries.<div class="qz-actions"><button class="btn btn-sec" onclick="goToFirstUnanswered()">Go to unanswered</button><button class="btn btn-retry" onclick="checkAll(true)">Grade including unanswered</button></div></div>`;document.getElementById('main').prepend(div);div.scrollIntoView({behavior:'smooth'});}return;
 }
 checked=true;let correct=0;const wrongItems=[],reviewData=[];
 curQueue.forEach((q,idx)=>{
  const given=curAnswers[idx],ok=q.t==='mc'?given===q.a:isIDCorrect(q,given);
  const yourDisplay=isAnswered(given)?q.t==='mc'?q.opts[given]:given:'(unanswered)';
  const correctDisplay=q.t==='mc'?q.opts[q.a]:(Array.isArray(q.a)?q.a:[q.a])[0];
  if(ok){correct++;gC++;gS++;missed.delete(q.id);}else{gW++;gS=0;missed.add(q.id);wrongItems.push(q);reviewData.push({q,yourDisplay,correctDisplay});}
 });retryQ=wrongItems;saveProgress();updateScoreBar();showResults(correct,curQueue.length,wrongItems,reviewData);
}
function showResults(correct,total,wrongItems,reviewData){
 const pct=Math.round(correct/total*100),ringClass=pct>=80?'great':pct>=50?'ok':'low';
 const msg=pct===100?'Perfect! Every answer correct.':pct>=80?'Great job! A few to review.':pct>=50?'Keep going — review and retry.':'Review the explanations, then try again.';
 let html=`<div class="res-card"><div class="res-ring ${ringClass}">${pct}%<div class="ring-sub">${correct}/${total}</div></div><h2>${msg}</h2><p>Checked once for this round. Correct retry answers leave the saved wrong-answer list.</p><div class="res-stats"><div class="rstat"><div class="rn g">${correct}</div><div class="rl">Correct</div></div><div class="rstat"><div class="rn r">${wrongItems.length}</div><div class="rl">Wrong / unanswered</div></div><div class="rstat"><div class="rn b">${total}</div><div class="rl">Total</div></div></div></div>`;
 if(wrongItems.length)html+=`<div class="retry-banner">↻ ${wrongItems.length} questions are ready for another attempt. Their saved status is retained in this browser when storage is available.</div>`;
 html+=`<div class="qz-actions">${wrongItems.length?`<button class="btn btn-retry" onclick="doRetry()">↻ Retry ${wrongItems.length} wrong answers</button>`:''}<button class="btn btn-sec" onclick="startQuiz('${curMeta.id}')">↺ Restart selection</button><button class="btn btn-sec" onclick="showHome()">← Home</button></div>`;
 if(reviewData.length)html+=`<div class="review-section"><div class="review-hd">Questions to review</div>${reviewData.map((rd,i)=>reviewItem(rd,i)).join('')}</div>`;
 html+=`<details class="review-section"><summary class="review-hd" style="cursor:pointer">Answer key and explanations for this round</summary>${curQueue.map((q,i)=>`<div class="review-item"><div class="qlesson">${esc(SUBJECTS[q._sub].label)} · ${esc(q._week)} · ${esc(q.source)}</div><div class="ri-q">${i+1}. ${esc(q.q)}</div><div class="ri-c">✓ ${esc(q.t==='mc'?q.opts[q.a]:q.a[0])}${q.originalLetter?' · Provided key: '+q.originalLetter:''}</div><div>${esc(q.e)}</div></div>`).join('')}</details>`;
 document.getElementById('main').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});
}
function reviewItem(rd,i){return `<div class="review-item"><div class="qlesson">${esc(SUBJECTS[rd.q._sub].label)} · ${esc(rd.q._week)} · ${esc(rd.q.source)}</div><div class="ri-q">${i+1}. ${esc(rd.q.q)}</div><div class="ri-y">✗ Your answer: ${esc(rd.yourDisplay)}</div><div class="ri-c">✓ Correct: ${esc(rd.correctDisplay)}${rd.q.originalLetter?' · Provided key: '+rd.q.originalLetter:''}</div><div>${esc(rd.q.e)}</div></div>`;}
function doRetry(){
 if(!retryQ.length)return;curQueue=shuffle(retryQ);retryQ=[];curAnswers=new Array(curQueue.length).fill(null);curMeta.retry=true;pageIndex=0;checked=false;pendingGrade=false;renderQuiz();window.scrollTo({top:0,behavior:'smooth'});
}
function updateScoreBar(){document.getElementById('gC').textContent=gC;document.getElementById('gW').textContent=gW;document.getElementById('gS').textContent=gS;const count=document.getElementById('missedNavCount');if(count)count.textContent='('+missed.size+')';}
function showSampleKey(){
 const questions=allQuestions('subject:im').filter(q=>q.kind==='sample');
 const html=questions.map((q,i)=>`<div class="review-item"><div class="qlesson">${esc(q._week)} · ${esc(q.source)}</div><div class="ri-q">${esc(q.q)}</div>${q.opts.map((o,j)=>`<div>${String.fromCharCode(65+j)}. ${esc(o)}</div>`).join('')}<details><summary style="cursor:pointer">Show provided answer</summary><div class="ri-c">${q.originalLetter}. ${esc(q.opts[q.a])}</div><p>${esc(q.e)}</p></details></div>`).join('');
 document.getElementById('main').innerHTML=`<div class="qz-header"><h2>Information Management · 50 Provided Samples</h2></div><p>Each answer retains its original A–D key. These questions are also integrated into the corresponding IM lessons.</p><div class="qz-actions"><button class="btn btn-sec" onclick="showHome()">← Home</button></div>${html}`;window.scrollTo({top:0,behavior:'smooth'});
}
buildSidebar();showHome();

</script>
</body>
</html>
