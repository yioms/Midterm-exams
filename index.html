<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Midterms Quiz Generator</title>
<style>
:root {
  --bg:#F2F0EB;
  --surface:#FDFCFA;
  --raised:#FFFFFF;
  --border:#DDD9D0;
  --border2:#CCCAC0;
  --ink:#18191F;
  --ink2:#52555E;
  --ink3:#9296A0;

  /* Subject accent colors */
  --ds:#1A5276;   --ds-lt:#E8F0F8;   --ds-mid:#2E86C1;
  --pm:#145A32;   --pm-lt:#E8F5EE;   --pm-mid:#1E8449;
  --im:#6C3483;   --im-lt:#F3EAF8;   --im-mid:#8E44AD;

  --good:#1E7E5A; --good-lt:#E6F4EE;
  --bad:#C0392B;  --bad-lt:#FCECEA;
  --warn:#A0522D; --warn-lt:#FDF0E6;

  --r:3px;
  font-size:15px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

/* === TOPBAR === */
.topbar{
  display:flex;align-items:center;gap:14px;
  background:var(--ink);color:#fff;
  padding:0 24px;height:52px;
  position:sticky;top:0;z-index:200;
  flex-shrink:0;
}
.topbar-brand{font-size:14.5px;font-weight:700;letter-spacing:-.2px;}
.topbar-sub{font-size:12px;color:#8A9BB5;margin-left:2px;}
.topbar-score{
  margin-left:auto;display:flex;gap:18px;align-items:center;
  font-size:12.5px;
}
.score-chip{
  background:rgba(255,255,255,.1);border-radius:20px;
  padding:3px 12px;display:flex;gap:8px;
}
.sc-c{color:#7DEFA0;font-weight:700;}
.sc-w{color:#FF8077;font-weight:700;}
.sc-s{color:#FFD166;font-weight:700;}

/* === LAYOUT === */
.shell{display:flex;flex:1;min-height:0;}

/* === SIDEBAR === */
.sidebar{
  width:270px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  position:sticky;top:52px;
  height:calc(100vh - 52px);
  padding-bottom:40px;
}
.sb-subject{
  border-bottom:1px solid var(--border);
}
.sb-subject-hd{
  display:flex;align-items:center;gap:10px;
  padding:13px 18px 12px;
  cursor:pointer;
  font-size:12.5px;font-weight:700;
  letter-spacing:.2px;
  position:sticky;top:0;
  z-index:10;
  border-left:3px solid transparent;
}
.sb-subject-hd:hover{opacity:.85;}
.sb-subject-hd.ds{background:var(--ds-lt);color:var(--ds);border-left-color:var(--ds);}
.sb-subject-hd.pm{background:var(--pm-lt);color:var(--pm);border-left-color:var(--pm);}
.sb-subject-hd.im{background:var(--im-lt);color:var(--im);border-left-color:var(--im);}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-dot.ds{background:var(--ds-mid);}
.sb-dot.pm{background:var(--pm-mid);}
.sb-dot.im{background:var(--im-mid);}
.sb-chevron{margin-left:auto;font-size:10px;transition:transform .2s;}
.sb-subject.open .sb-chevron{transform:rotate(90deg);}
.sb-lessons{display:none;}
.sb-subject.open .sb-lessons{display:block;}
.sb-lesson{
  display:flex;align-items:center;gap:10px;
  padding:8px 18px 8px 30px;
  cursor:pointer;
  font-size:13px;color:var(--ink2);
  border-left:3px solid transparent;
  transition:background .1s;
}
.sb-lesson:hover{background:var(--bg);color:var(--ink);}
.sb-lesson.active{color:var(--ink);font-weight:600;background:var(--bg);}
.sb-lesson.active.ds{border-left-color:var(--ds);}
.sb-lesson.active.pm{border-left-color:var(--pm);}
.sb-lesson.active.im{border-left-color:var(--im);}
.sb-count{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--bg);border-radius:10px;padding:1px 7px;flex-shrink:0;}
.sb-all{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;cursor:pointer;
  background:var(--ink);color:#fff;
  font-size:13px;font-weight:600;
}
.sb-all:hover{background:#2a2d38;}

/* === MAIN === */
.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:900px;}

/* === HOME === */
.home-header{
  background:var(--ink);color:#fff;
  border-radius:var(--r);padding:32px;
  margin-bottom:24px;
}
.home-header h1{font-size:22px;font-weight:800;margin-bottom:8px;line-height:1.3;}
.home-header p{color:#8A9BB5;font-size:14px;max-width:58ch;line-height:1.65;}
.home-stats{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;}
.hstat{background:rgba(255,255,255,.08);border-radius:var(--r);padding:12px 18px;min-width:100px;}
.hstat .hn{font-size:26px;font-weight:800;color:#7EB3FF;}
.hstat .hl{font-size:11.5px;color:#8A9BB5;margin-top:2px;}

.subject-section{margin-bottom:28px;}
.subject-section-hd{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:2px solid;
  font-size:13px;font-weight:700;
}
.subject-section-hd.ds{color:var(--ds);border-color:var(--ds);}
.subject-section-hd.pm{color:var(--pm);border-color:var(--pm);}
.subject-section-hd.im{color:var(--im);border-color:var(--im);}
.subject-pill{
  font-size:10.5px;font-weight:700;padding:2px 10px;
  border-radius:20px;
}
.subject-pill.ds{background:var(--ds-lt);color:var(--ds);}
.subject-pill.pm{background:var(--pm-lt);color:var(--pm);}
.subject-pill.im{background:var(--im-lt);color:var(--im);}

.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.lcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.lcard:hover{border-color:var(--border2);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.lcard .lc-week{font-size:11px;color:var(--ink3);margin-bottom:4px;}
.lcard h3{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:6px;}
.lcard .lc-q{font-size:12px;color:var(--ink3);}
.lcard .lc-bar{height:2px;background:var(--border);margin-top:10px;border-radius:2px;overflow:hidden;}
.lcard .lc-bar-fill{height:100%;width:0%;transition:width .4s;}
.lcard.ds .lc-bar-fill{background:var(--ds-mid);}
.lcard.pm .lc-bar-fill{background:var(--pm-mid);}
.lcard.im .lc-bar-fill{background:var(--im-mid);}

/* === QUIZ HEADER === */
.qz-header{
  display:flex;align-items:flex-start;gap:14px;
  padding-bottom:18px;border-bottom:1px solid var(--border);
  margin-bottom:20px;
}
.qz-header-text h2{font-size:18px;font-weight:700;}
.qz-header-text p{font-size:13px;color:var(--ink2);margin-top:3px;}
.qz-tag{
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:20px;white-space:nowrap;
  margin-top:2px;flex-shrink:0;
}
.qz-tag.ds{background:var(--ds-lt);color:var(--ds);}
.qz-tag.pm{background:var(--pm-lt);color:var(--pm);}
.qz-tag.im{background:var(--im-lt);color:var(--im);}
.qz-tag.mixed{background:#e8e4f8;color:#4A3A8A;}

.prog-wrap{margin-bottom:22px;}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:5px;}
.prog-track{height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}
.prog-fill.ds{background:var(--ds-mid);}
.prog-fill.pm{background:var(--pm-mid);}
.prog-fill.im{background:var(--im-mid);}
.prog-fill.mixed{background:#7B68EE;}

/* === QUESTION CARD === */
.qcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 24px;
  margin-bottom:14px;
}
.qcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qtype-badge{
  font-size:10.5px;font-weight:700;color:var(--ink3);
  background:var(--bg);border:1px solid var(--border);
  padding:2px 8px;border-radius:10px;
}
.qnum{font-size:11.5px;color:var(--ink3);}
.qlesson{font-size:11px;color:var(--ink3);}
.qtext{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:16px;max-width:65ch;}

/* MC options */
.opts{list-style:none;display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:flex-start;gap:11px;
  width:100%;text-align:left;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r);padding:10px 14px;
  cursor:pointer;font-size:14px;color:var(--ink);
  transition:border-color .1s,background .1s;
  font-family:inherit;line-height:1.45;
}
.opt-circle{
  width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--border2);background:#fff;
  flex-shrink:0;margin-top:1px;transition:all .1s;
}
.opt:hover:not(:disabled){border-color:var(--border2);}
.opt.sel{border-color:#6060C0;background:#F0EEFF;}
.opt.sel .opt-circle{background:#6060C0;border-color:#6060C0;}
.opt.correct{border-color:var(--good);background:var(--good-lt);color:var(--good);}
.opt.correct .opt-circle{background:var(--good);border-color:var(--good);}
.opt.wrong{border-color:var(--bad);background:var(--bad-lt);color:var(--bad);}
.opt.wrong .opt-circle{background:var(--bad);border-color:var(--bad);}
.opt:disabled{cursor:default;}

/* ID input */
.id-wrap{display:flex;flex-direction:column;gap:6px;}
.id-label{font-size:12.5px;color:var(--ink2);}
.id-input{
  border:1.5px solid var(--border);background:var(--bg);
  border-radius:var(--r);padding:10px 13px;
  font-size:14px;color:var(--ink);font-family:inherit;
  max-width:400px;width:100%;
  transition:border-color .12s;
}
.id-input:focus{outline:none;border-color:#6060C0;background:#F8F7FF;}
.id-input.correct{border-color:var(--good);background:var(--good-lt);color:var(--good);}
.id-input.wrong{border-color:var(--bad);background:var(--bad-lt);color:var(--bad);}
.id-input:disabled{cursor:default;}
.id-hint{font-size:11.5px;color:var(--ink3);font-style:italic;}

/* Feedback */
.feedback{
  margin-top:11px;padding:9px 13px;
  border-radius:var(--r);font-size:13px;line-height:1.5;
  display:none;border-left:3px solid;
}
.feedback.show{display:block;}
.feedback.correct{background:var(--good-lt);color:var(--good);border-left-color:var(--good);}
.feedback.wrong{background:var(--bad-lt);color:var(--bad);border-left-color:var(--bad);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:var(--r);
  font-size:13.5px;font-weight:600;cursor:pointer;
  border:none;font-family:inherit;
  transition:opacity .1s,transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-pri{background:var(--ink);color:#fff;}
.btn-pri:hover{opacity:.85;}
.btn-sec{background:var(--surface);color:var(--ink);border:1px solid var(--border2);}
.btn-sec:hover{background:var(--bg);}
.btn-retry{background:#4A3A8A;color:#fff;}
.btn-retry:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.qz-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}

/* Results */
.res-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:28px;margin-bottom:20px;
  text-align:center;
}
.res-ring{
  width:100px;height:100px;border-radius:50%;
  border:5px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 18px;font-size:27px;font-weight:800;
}
.res-ring.great{border-color:var(--good);color:var(--good);}
.res-ring.ok{border-color:#B08A2E;color:#B08A2E;}
.res-ring.low{border-color:var(--bad);color:var(--bad);}
.res-ring .ring-sub{font-size:11px;font-weight:500;}
.res-card h2{font-size:18px;font-weight:700;margin-bottom:6px;}
.res-card p{color:var(--ink2);font-size:13.5px;}
.res-stats{display:flex;gap:18px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rstat .rn{font-size:22px;font-weight:800;}
.rstat .rl{font-size:11px;color:var(--ink3);margin-top:1px;text-align:center;}
.rn.g{color:var(--good);}
.rn.r{color:var(--bad);}
.rn.b{color:#4A3A8A;}

.retry-banner{
  background:var(--warn-lt);border:1px solid #E8B87A;
  border-radius:var(--r);padding:12px 16px;margin-bottom:18px;
  font-size:13.5px;color:var(--warn);
  display:flex;align-items:center;gap:10px;
}

.review-section{margin-top:24px;}
.review-hd{font-size:13px;font-weight:700;color:var(--ink2);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.review-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:13px 16px;margin-bottom:9px;
  font-size:13px;
}
.ri-q{font-weight:600;margin-bottom:5px;}
.ri-y{color:var(--bad);margin-bottom:3px;}
.ri-c{color:var(--good);}

@media(max-width:740px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;}
  .main{padding:18px 16px 48px;max-width:100%;}
  .topbar{padding:0 14px;}
  .home-header{padding:22px 18px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <span class="topbar-brand">Midterms Quiz Generator</span>

    ✓ <span class="sc-c" id="gC">0</span>

<div class="shell">
  <nav class="sidebar" id="sidebar">

      <div class="sb-lessons" id="sb-lessons-ds"></div>
    </div>

    <!-- PROJECT MANAGEMENT -->
    <div class="sb-subject" id="sb-pm">
      <div class="sb-subject-hd pm" onclick="toggleSubject('pm')">
        <span class="sb-dot pm"></span>
        Project Management
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-lessons" id="sb-lessons-pm"></div>
    </div>

    <!-- INFORMATION MANAGEMENT -->
    <div class="sb-subject" id="sb-im">
      <div class="sb-subject-hd im" onclick="toggleSubject('im')">
        <span class="sb-dot im"></span>
        Information Management
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-lessons" id="sb-lessons-im"></div>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

let gC=0,gW=0,gS=0;
let curQueue=[],curMeta={},curAnswers=[],retryQ=[];

function norm(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ');}
function isIDCorrect(q,val){
  if(!val||val==='')return false;
  const arr=Array.isArray(q.a)?q.a:[q.a];
  const n=norm(val);
  return arr.some(a=>{
    const na=norm(a);
    return na===n||na.split(' ').every(w=>n.includes(w))||n.split(' ').every(w=>na.includes(w));
  });
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

function buildSidebar(){
  ['ds','pm','im'].forEach(sub=>{
    const cont=document.getElementById(`sb-lessons-${sub}`);
    cont.innerHTML='';
    LESSONS.filter(l=>l.subject===sub).forEach(l=>{
      const div=document.createElement('div');
      div.className=`sb-lesson ${sub}`;
      div.id=`sbl-${l.id}`;
      div.innerHTML=`<span style="font-size:11px;color:var(--ink3);margin-right:4px;">${l.week}</span><span>${l.title}</span><span class="sb-count">${l.questions.length}</span>`;
      div.onclick=()=>startQuiz(l.id);
      cont.appendChild(div);
    });
  });
}
function toggleSubject(sub){
  const el=document.getElementById(`sb-${sub}`);
  el.classList.toggle('open');

  document.querySelectorAll('.sb-lesson').forEach(el=>el.classList.remove('active'));

/* ======================================================
   START QUIZ
   ====================================================== */
function startQuiz(id,retry=false){
  setActiveLesson(id==='all'?null:id);
  if(id==='all'){
    curMeta={id:'all',label:'Full Mixed Review — All Lessons',sub:'mixed'};
    curQueue=retry?[...retryQ]:shuffle(LESSONS.flatMap(l=>l.questions.map((q,i)=>({...q,_lid:l.id,_sub:l.subject,_lt:l.title}))));
  } else {
    const lesson=LESSONS.find(l=>l.id===id);
    curMeta={id,label:`${lesson.week} · ${lesson.title}`,sub:lesson.subject};
    curQueue=retry?[...retryQ]:lesson.questions.map((q,i)=>({...q,_lid:lesson.id,_sub:lesson.subject,_lt:lesson.title}));
  }
  if(!retry)retryQ=[];
  curAnswers=new Array(curQueue.length).fill(null);
  renderQuiz();
}

/* ======================================================
   RENDER QUIZ
   ====================================================== */
function renderQuiz(){
  const total=curQueue.length;
  const answered=curAnswers.filter(a=>a!==null&&a!=='').length;
  const pct=total?Math.round(answered/total*100):0;
  const sc=curMeta.sub;
  let html=`
    <div class="qz-header">
      <div class="qz-header-text">
        <h2>${curMeta.label}</h2>
        <p>${total} question${total!==1?'s':''} · Answer all, then check</p>
      </div>
      <span class="qz-tag ${sc}">${sc==='mixed'?'Mixed Review':SUBJECTS[sc]?.label||sc}</span>
    </div>
    <div class="prog-wrap">
      <div class="prog-info"><span id="progTxt">Answered: ${answered} / ${total}</span><span>${pct}%</span></div>
      <div class="prog-track"><div class="prog-fill ${sc}" id="progFill" style="width:${pct}%"></div></div>
    </div>
  `;
  curQueue.forEach((q,idx)=>{
    const isAll=curMeta.id==='all';
    html+=`<div class="qcard" id="qc${idx}">
      <div class="qcard-meta">
        <span class="qtype-badge">${q.t==='mc'?'◉ Multiple Choice':'✏ Identification'}</span>
        <span class="qnum">Q${idx+1} / ${total}</span>
        ${isAll?`<span class="qlesson">— ${q._lt}</span>`:''}
      </div>
      <div class="qtext">${q.q}</div>
      ${q.t==='mc'?renderMC(q,idx):renderID(q,idx)}
      <div class="feedback" id="fb${idx}"></div>
    </div>`;
  });
  html+=`<div class="qz-actions" id="qzActions">
    <button class="btn btn-pri" onclick="checkAll()">Check All Answers</button>
    <button class="btn btn-sec" onclick="showHome()">← Home</button>
  </div>`;
  const main=document.getElementById('main');
  main.innerHTML=html;
  main.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(btn.disabled)return;
      const idx=+btn.dataset.idx;
      curAnswers[idx]=+btn.dataset.opt;
      main.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      updateProg();
    });
  });
  main.querySelectorAll('.id-input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      curAnswers[+inp.dataset.idx]=inp.value.trim();
      updateProg();
    });
  });
}
function renderMC(q,idx){
  return `<ul class="opts">${q.opts.map((o,oi)=>`<li><button class="opt" data-idx="${idx}" data-opt="${oi}"><span class="opt-circle"></span>${o}</button></li>`).join('')}</ul>`;
}
function renderID(q,idx){
  return `<div class="id-wrap">
    <label class="id-label">Type your answer:</label>
    <input class="id-input" type="text" data-idx="${idx}" placeholder="Your answer…" autocomplete="off" spellcheck="false">
    <span class="id-hint">Key term accepted — capitalisation doesn't matter.</span>
  </div>`;
}
function updateProg(){
  const total=curQueue.length;
  const answered=curAnswers.filter(a=>a!==null&&a!=='').length;
  const pct=Math.round(answered/total*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent=`Answered: ${answered} / ${total}`;
}

/* ======================================================
   CHECK ANSWERS
   ====================================================== */
function checkAll(){
  let correct=0,wrong=0;
  const wrongItems=[],reviewData=[];
  curQueue.forEach((q,idx)=>{
    const card=document.getElementById(`qc${idx}`);
    const fb=document.getElementById(`fb${idx}`);
    let ok=false,yourDisplay='',correctDisplay='';
    if(q.t==='mc'){
      const given=curAnswers[idx];
      ok=given===q.a;
      yourDisplay=given!==null?q.opts[given]:'(no answer)';
      correctDisplay=q.opts[q.a];
      card.querySelectorAll('.opt').forEach(btn=>{
        const oi=+btn.dataset.opt;
        btn.disabled=true;
        if(oi===q.a)btn.classList.add('correct');
        else if(oi===given)btn.classList.add('wrong');
      });
    } else {
      const given=curAnswers[idx]||'';
      ok=isIDCorrect(q,given);
      yourDisplay=given||'(no answer)';
      const arr=Array.isArray(q.a)?q.a:[q.a];
      correctDisplay=arr[0];
      const inp=card.querySelector('.id-input');
      if(inp){inp.disabled=true;inp.classList.add(ok?'correct':'wrong');}
    }
    fb.classList.add('show');
    if(ok){
      fb.className='feedback correct show';
      fb.innerHTML='<strong>✓ Correct!</strong>';
      correct++;gC++;gS++;
    } else {
      fb.className='feedback wrong show';
      fb.innerHTML=`<strong>✗ Wrong.</strong> Your answer: "<em>${yourDisplay}</em>" — Correct: <strong>${correctDisplay}</strong>`;
      wrong++;gW++;gS=0;
      wrongItems.push({...q});
      reviewData.push({q,yourDisplay,correctDisplay});
    }
  });
  updateScoreBar();
  retryQ=wrongItems;
  document.getElementById('qzActions').remove();
  showResults(correct,curQueue.length,wrongItems,reviewData);
}

/* ======================================================
   RESULTS
   ====================================================== */
function showResults(correct,total,wrongItems,reviewData){
  const pct=Math.round(correct/total*100);
  const ringClass=pct>=80?'great':pct>=50?'ok':'low';
  const msg=pct===100?'Perfect! Every answer correct.':pct>=80?'Great job! A few to review.':pct>=50?'Halfway there — keep going!':'Don\'t stop — retry and lock it in.';
  let html=`<div class="res-card">
    <div class="res-ring ${ringClass}">${pct}%<div class="ring-sub">${correct}/${total}</div></div>
    <h2>${msg}</h2>
    <p>Round complete. Check your breakdown below.</p>
    <div class="res-stats">
      <div class="rstat"><div class="rn g">${correct}</div><div class="rl">Correct</div></div>
      <div class="rstat"><div class="rn r">${wrongItems.length}</div><div class="rl">Wrong</div></div>
      <div class="rstat"><div class="rn b">${total}</div><div class="rl">Total</div></div>
    </div>
  </div>`;
  if(wrongItems.length>0){
    html+=`<div class="retry-banner">🔁 <strong>${wrongItems.length} question${wrongItems.length>1?'s':''} to retry</strong> — they'll be re-queued until you get them right.</div>`;
  }
  html+=`<div class="qz-actions">
    ${wrongItems.length>0?`<button class="btn btn-retry" onclick="doRetry()">🔁 Retry ${wrongItems.length} wrong answer${wrongItems.length>1?'s':''}</button>`:''}
    <button class="btn btn-sec" onclick="startQuiz('${curMeta.id}')">↺ Restart</button>
    <button class="btn btn-sec" onclick="showHome()">← Home</button>
  </div>`;
  if(reviewData.length>0){
    html+=`<div class="review-section"><div class="review-hd">Questions you got wrong</div>`;
    reviewData.forEach((rd,i)=>{
      html+=`<div class="review-item">
        <div class="ri-q">${i+1}. ${rd.q.q}</div>
        <div class="ri-y">✗ Your answer: ${rd.yourDisplay}</div>
        <div class="ri-c">✓ Correct answer: ${rd.correctDisplay}</div>
      </div>`;
    });
    html+=`</div>`;
  }
  const main=document.getElementById('main');
  main.insertAdjacentHTML('afterbegin',html);
  main.scrollIntoView({behavior:'smooth',block:'start'});
}
function doRetry(){
  curQueue=[...retryQ];retryQ=[];
  curAnswers=new Array(curQueue.length).fill(null);
  renderQuiz();
}
function updateScoreBar(){
  document.getElementById('gC').textContent=gC;
  document.getElementById('gW').textContent=gW;
  document.getElementById('gS').textContent=gS;
}

/* ======================================================
   INIT
   ====================================================== */
buildSidebar();
showHome();
</script>
</body>
</html>
