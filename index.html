<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Midterms Quiz Generator</title>
<style>
:root {
  --bg:#F2F0EB;
  --surface:#FDFCFA;
  --raised:#FFFFFF;
  --border:#DDD9D0;
  --border2:#CCCAC0;
  --ink:#18191F;
  --ink2:#52555E;
  --ink3:#9296A0;

  /* Subject accent colors */
  --ds:#1A5276;   --ds-lt:#E8F0F8;   --ds-mid:#2E86C1;
  --pm:#145A32;   --pm-lt:#E8F5EE;   --pm-mid:#1E8449;
  --im:#6C3483;   --im-lt:#F3EAF8;   --im-mid:#8E44AD;

  --good:#1E7E5A; --good-lt:#E6F4EE;
  --bad:#C0392B;  --bad-lt:#FCECEA;
  --warn:#A0522D; --warn-lt:#FDF0E6;

  --r:3px;
  font-size:15px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}

/* === TOPBAR === */
.topbar{
  display:flex;align-items:center;gap:14px;
  background:var(--ink);color:#fff;
  padding:0 24px;height:52px;
  position:sticky;top:0;z-index:200;
  flex-shrink:0;
}
.topbar-brand{font-size:14.5px;font-weight:700;letter-spacing:-.2px;}
.topbar-sub{font-size:12px;color:#8A9BB5;margin-left:2px;}
.topbar-score{
  margin-left:auto;display:flex;gap:18px;align-items:center;
  font-size:12.5px;
}
.score-chip{
  background:rgba(255,255,255,.1);border-radius:20px;
  padding:3px 12px;display:flex;gap:8px;
}
.sc-c{color:#7DEFA0;font-weight:700;}
.sc-w{color:#FF8077;font-weight:700;}
.sc-s{color:#FFD166;font-weight:700;}

/* === LAYOUT === */
.shell{display:flex;flex:1;min-height:0;}

/* === SIDEBAR === */
.sidebar{
  width:270px;flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  position:sticky;top:52px;
  height:calc(100vh - 52px);
  padding-bottom:40px;
}
.sb-subject{
  border-bottom:1px solid var(--border);
}
.sb-subject-hd{
  display:flex;align-items:center;gap:10px;
  padding:13px 18px 12px;
  cursor:pointer;
  font-size:12.5px;font-weight:700;
  letter-spacing:.2px;
  position:sticky;top:0;
  z-index:10;
  border-left:3px solid transparent;
}
.sb-subject-hd:hover{opacity:.85;}
.sb-subject-hd.ds{background:var(--ds-lt);color:var(--ds);border-left-color:var(--ds);}
.sb-subject-hd.pm{background:var(--pm-lt);color:var(--pm);border-left-color:var(--pm);}
.sb-subject-hd.im{background:var(--im-lt);color:var(--im);border-left-color:var(--im);}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sb-dot.ds{background:var(--ds-mid);}
.sb-dot.pm{background:var(--pm-mid);}
.sb-dot.im{background:var(--im-mid);}
.sb-chevron{margin-left:auto;font-size:10px;transition:transform .2s;}
.sb-subject.open .sb-chevron{transform:rotate(90deg);}
.sb-lessons{display:none;}
.sb-subject.open .sb-lessons{display:block;}
.sb-lesson{
  display:flex;align-items:center;gap:10px;
  padding:8px 18px 8px 30px;
  cursor:pointer;
  font-size:13px;color:var(--ink2);
  border-left:3px solid transparent;
  transition:background .1s;
}
.sb-lesson:hover{background:var(--bg);color:var(--ink);}
.sb-lesson.active{color:var(--ink);font-weight:600;background:var(--bg);}
.sb-lesson.active.ds{border-left-color:var(--ds);}
.sb-lesson.active.pm{border-left-color:var(--pm);}
.sb-lesson.active.im{border-left-color:var(--im);}
.sb-count{margin-left:auto;font-size:11px;color:var(--ink3);background:var(--bg);border-radius:10px;padding:1px 7px;flex-shrink:0;}
.sb-all{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;cursor:pointer;
  background:var(--ink);color:#fff;
  font-size:13px;font-weight:600;
}
.sb-all:hover{background:#2a2d38;}

/* === MAIN === */
.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:900px;}

/* === HOME === */
.home-header{
  background:var(--ink);color:#fff;
  border-radius:var(--r);padding:32px;
  margin-bottom:24px;
}
.home-header h1{font-size:22px;font-weight:800;margin-bottom:8px;line-height:1.3;}
.home-header p{color:#8A9BB5;font-size:14px;max-width:58ch;line-height:1.65;}
.home-stats{display:flex;gap:16px;margin-top:20px;flex-wrap:wrap;}
.hstat{background:rgba(255,255,255,.08);border-radius:var(--r);padding:12px 18px;min-width:100px;}
.hstat .hn{font-size:26px;font-weight:800;color:#7EB3FF;}
.hstat .hl{font-size:11.5px;color:#8A9BB5;margin-top:2px;}

.subject-section{margin-bottom:28px;}
.subject-section-hd{
  display:flex;align-items:center;gap:10px;
  margin-bottom:12px;padding-bottom:10px;
  border-bottom:2px solid;
  font-size:13px;font-weight:700;
}
.subject-section-hd.ds{color:var(--ds);border-color:var(--ds);}
.subject-section-hd.pm{color:var(--pm);border-color:var(--pm);}
.subject-section-hd.im{color:var(--im);border-color:var(--im);}
.subject-pill{
  font-size:10.5px;font-weight:700;padding:2px 10px;
  border-radius:20px;
}
.subject-pill.ds{background:var(--ds-lt);color:var(--ds);}
.subject-pill.pm{background:var(--pm-lt);color:var(--pm);}
.subject-pill.im{background:var(--im-lt);color:var(--im);}

.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.lcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:border-color .15s,box-shadow .15s;
}
.lcard:hover{border-color:var(--border2);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.lcard .lc-week{font-size:11px;color:var(--ink3);margin-bottom:4px;}
.lcard h3{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35;margin-bottom:6px;}
.lcard .lc-q{font-size:12px;color:var(--ink3);}
.lcard .lc-bar{height:2px;background:var(--border);margin-top:10px;border-radius:2px;overflow:hidden;}
.lcard .lc-bar-fill{height:100%;width:0%;transition:width .4s;}
.lcard.ds .lc-bar-fill{background:var(--ds-mid);}
.lcard.pm .lc-bar-fill{background:var(--pm-mid);}
.lcard.im .lc-bar-fill{background:var(--im-mid);}

/* === QUIZ HEADER === */
.qz-header{
  display:flex;align-items:flex-start;gap:14px;
  padding-bottom:18px;border-bottom:1px solid var(--border);
  margin-bottom:20px;
}
.qz-header-text h2{font-size:18px;font-weight:700;}
.qz-header-text p{font-size:13px;color:var(--ink2);margin-top:3px;}
.qz-tag{
  font-size:11px;font-weight:700;padding:3px 10px;
  border-radius:20px;white-space:nowrap;
  margin-top:2px;flex-shrink:0;
}
.qz-tag.ds{background:var(--ds-lt);color:var(--ds);}
.qz-tag.pm{background:var(--pm-lt);color:var(--pm);}
.qz-tag.im{background:var(--im-lt);color:var(--im);}
.qz-tag.mixed{background:#e8e4f8;color:#4A3A8A;}

.prog-wrap{margin-bottom:22px;}
.prog-info{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:5px;}
.prog-track{height:4px;background:var(--border);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;}
.prog-fill.ds{background:var(--ds-mid);}
.prog-fill.pm{background:var(--pm-mid);}
.prog-fill.im{background:var(--im-mid);}
.prog-fill.mixed{background:#7B68EE;}

/* === QUESTION CARD === */
.qcard{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:22px 24px;
  margin-bottom:14px;
}
.qcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qtype-badge{
  font-size:10.5px;font-weight:700;color:var(--ink3);
  background:var(--bg);border:1px solid var(--border);
  padding:2px 8px;border-radius:10px;
}
.qnum{font-size:11.5px;color:var(--ink3);}
.qlesson{font-size:11px;color:var(--ink3);}
.qtext{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:16px;max-width:65ch;}

/* MC options */
.opts{list-style:none;display:flex;flex-direction:column;gap:8px;}
.opt{
  display:flex;align-items:flex-start;gap:11px;
  width:100%;text-align:left;
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r);padding:10px 14px;
  cursor:pointer;font-size:14px;color:var(--ink);
  transition:border-color .1s,background .1s;
  font-family:inherit;line-height:1.45;
}
.opt-circle{
  width:16px;height:16px;border-radius:50%;
  border:1.5px solid var(--border2);background:#fff;
  flex-shrink:0;margin-top:1px;transition:all .1s;
}
.opt:hover:not(:disabled){border-color:var(--border2);}
.opt.sel{border-color:#6060C0;background:#F0EEFF;}
.opt.sel .opt-circle{background:#6060C0;border-color:#6060C0;}
.opt.correct{border-color:var(--good);background:var(--good-lt);color:var(--good);}
.opt.correct .opt-circle{background:var(--good);border-color:var(--good);}
.opt.wrong{border-color:var(--bad);background:var(--bad-lt);color:var(--bad);}
.opt.wrong .opt-circle{background:var(--bad);border-color:var(--bad);}
.opt:disabled{cursor:default;}

/* ID input */
.id-wrap{display:flex;flex-direction:column;gap:6px;}
.id-label{font-size:12.5px;color:var(--ink2);}
.id-input{
  border:1.5px solid var(--border);background:var(--bg);
  border-radius:var(--r);padding:10px 13px;
  font-size:14px;color:var(--ink);font-family:inherit;
  max-width:400px;width:100%;
  transition:border-color .12s;
}
.id-input:focus{outline:none;border-color:#6060C0;background:#F8F7FF;}
.id-input.correct{border-color:var(--good);background:var(--good-lt);color:var(--good);}
.id-input.wrong{border-color:var(--bad);background:var(--bad-lt);color:var(--bad);}
.id-input:disabled{cursor:default;}
.id-hint{font-size:11.5px;color:var(--ink3);font-style:italic;}

/* Feedback */
.feedback{
  margin-top:11px;padding:9px 13px;
  border-radius:var(--r);font-size:13px;line-height:1.5;
  display:none;border-left:3px solid;
}
.feedback.show{display:block;}
.feedback.correct{background:var(--good-lt);color:var(--good);border-left-color:var(--good);}
.feedback.wrong{background:var(--bad-lt);color:var(--bad);border-left-color:var(--bad);}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 20px;border-radius:var(--r);
  font-size:13.5px;font-weight:600;cursor:pointer;
  border:none;font-family:inherit;
  transition:opacity .1s,transform .1s;
}
.btn:active{transform:scale(.98);}
.btn-pri{background:var(--ink);color:#fff;}
.btn-pri:hover{opacity:.85;}
.btn-sec{background:var(--surface);color:var(--ink);border:1px solid var(--border2);}
.btn-sec:hover{background:var(--bg);}
.btn-retry{background:#4A3A8A;color:#fff;}
.btn-retry:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

.qz-actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}

/* Results */
.res-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:28px;margin-bottom:20px;
  text-align:center;
}
.res-ring{
  width:100px;height:100px;border-radius:50%;
  border:5px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin:0 auto 18px;font-size:27px;font-weight:800;
}
.res-ring.great{border-color:var(--good);color:var(--good);}
.res-ring.ok{border-color:#B08A2E;color:#B08A2E;}
.res-ring.low{border-color:var(--bad);color:var(--bad);}
.res-ring .ring-sub{font-size:11px;font-weight:500;}
.res-card h2{font-size:18px;font-weight:700;margin-bottom:6px;}
.res-card p{color:var(--ink2);font-size:13.5px;}
.res-stats{display:flex;gap:18px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.rstat .rn{font-size:22px;font-weight:800;}
.rstat .rl{font-size:11px;color:var(--ink3);margin-top:1px;text-align:center;}
.rn.g{color:var(--good);}
.rn.r{color:var(--bad);}
.rn.b{color:#4A3A8A;}

.retry-banner{
  background:var(--warn-lt);border:1px solid #E8B87A;
  border-radius:var(--r);padding:12px 16px;margin-bottom:18px;
  font-size:13.5px;color:var(--warn);
  display:flex;align-items:center;gap:10px;
}

.review-section{margin-top:24px;}
.review-hd{font-size:13px;font-weight:700;color:var(--ink2);padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.review-item{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:13px 16px;margin-bottom:9px;
  font-size:13px;
}
.ri-q{font-weight:600;margin-bottom:5px;}
.ri-y{color:var(--bad);margin-bottom:3px;}
.ri-c{color:var(--good);}

@media(max-width:740px){
  .shell{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:static;}
  .main{padding:18px 16px 48px;max-width:100%;}
  .topbar{padding:0 14px;}
  .home-header{padding:22px 18px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}

button:focus-visible,[role="button"]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ds-mid);outline-offset:3px;}
button:disabled{opacity:.5;cursor:default;}
.qtext,.review-item,.opt,.qlesson{overflow-wrap:anywhere;}
.qz-actions{flex-wrap:wrap;}
@media(max-width:420px){.topbar-sub{display:none}.topbar-score{gap:6px;padding:3px 7px}.topbar-brand{font-size:12px}}
</style>
</head>
<body>

<header class="topbar">
  <div>
    <span class="topbar-brand">Midterms Quiz Generator</span>
    <span class="topbar-sub">QCU · IT</span>
  </div>
  <div class="topbar-score score-chip">
    ✓ <span class="sc-c" id="gC">0</span>
    &nbsp;✗ <span class="sc-w" id="gW">0</span>
    &nbsp;🔥 <span class="sc-s" id="gS">0</span>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="sb-all" onclick="startQuiz('all')">★ Full Mixed Review</div>

    <!-- DATA STRUCTURES -->
    <div class="sb-subject" id="sb-ds">
      <div class="sb-subject-hd ds" onclick="toggleSubject('ds')">
        <span class="sb-dot ds"></span>
        Data Structures
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-lessons" id="sb-lessons-ds"></div>
    </div>

    <!-- PROJECT MANAGEMENT -->
    <div class="sb-subject" id="sb-pm">
      <div class="sb-subject-hd pm" onclick="toggleSubject('pm')">
        <span class="sb-dot pm"></span>
        Project Management
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-lessons" id="sb-lessons-pm"></div>
    </div>

    <!-- INFORMATION MANAGEMENT -->
    <div class="sb-subject" id="sb-im">
      <div class="sb-subject-hd im" onclick="toggleSubject('im')">
        <span class="sb-dot im"></span>
        Information Management
        <span class="sb-chevron">▶</span>
      </div>
      <div class="sb-lessons" id="sb-lessons-im"></div>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
const SUBJECTS = {"ds": {"label": "Data Structures", "color": "ds"}, "pm": {"label": "IS Project Management", "color": "pm"}, "im": {"label": "Information Management", "color": "im"}, "pf": {"label": "PATHFIT · Pickleball", "color": "ds"}, "tech": {"label": "Technopreneurship", "color": "pm"}, "net": {"label": "Networking · NET101", "color": "ds"}};
const LESSONS = [{"id": "ds-w2", "subject": "ds", "week": "Week 2", "title": "Algorithms — Introduction & Properties", "questions": [{"t": "mc", "q": "What is an algorithm?", "opts": ["A programming language", "A sequence of steps that, when followed, accomplishes a particular task", "A type of computer hardware", "A database management system"], "a": 1, "id": "ds-w2-54be08bdb235", "e": "Key answer: A sequence of steps that, when followed, accomplishes a particular task", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "After whom was the term \"algorithm\" named?", "opts": ["Alan Turing", "Euclid", "al-KhowArizmi", "Charles Bachman"], "a": 2, "id": "ds-w2-fbc914c74087", "e": "Key answer: al-KhowArizmi", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What is Computer Science defined as in the lesson?", "opts": ["The study of hardware design only", "The study of mathematics", "The field that studies how to solve problems effectively and efficiently with the aid of computers", "The study of database systems"], "a": 2, "id": "ds-w2-2ea2a18165de", "e": "Key answer: The field that studies how to solve problems effectively and efficiently with the aid of computers", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What are the two major subfields of Computer Science mentioned in the lesson?", "opts": ["Coding and Testing", "Design and Analysis", "Hardware and Software", "Input and Output"], "a": 1, "id": "ds-w2-757c6d1eed0f", "e": "Key answer: Design and Analysis", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which famous historical algorithm is used to calculate the GCD of two integers?", "opts": ["Newton's Algorithm", "Dijkstra's Algorithm", "Euclid's Algorithm", "Bubble Sort"], "a": 2, "id": "ds-w2-298efbadd64d", "e": "Key answer: Euclid's Algorithm", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What does GCD stand for?", "opts": ["Greatest Common Divisor", "General Code Definition", "Graphical Component Design", "Global Computation Directive"], "a": 0, "id": "ds-w2-b4965c02f03c", "e": "Key answer: Greatest Common Divisor", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "How many properties does an algorithm have?", "opts": ["3", "4", "5", "6"], "a": 2, "id": "ds-w2-8f8ee24ac869", "e": "Key answer: 5", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which property states that an algorithm must terminate within a finite amount of time?", "opts": ["Definiteness", "Effectiveness", "Input", "Finiteness"], "a": 3, "id": "ds-w2-01b40edd02ae", "e": "Key answer: Finiteness", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which property states that every step must be precise and unambiguous?", "opts": ["Finiteness", "Definiteness", "Effectiveness", "Output"], "a": 1, "id": "ds-w2-77756557683a", "e": "Key answer: Definiteness", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which property states that each operation is basic, executable, and finishable in finite time?", "opts": ["Finiteness", "Definiteness", "Effectiveness", "Input"], "a": 2, "id": "ds-w2-fac132ebbb71", "e": "Key answer: Effectiveness", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "How many inputs must an algorithm accept according to the Input property?", "opts": ["Exactly one", "At least one", "Zero or more", "Exactly two"], "a": 2, "id": "ds-w2-1ad7d091663d", "e": "Key answer: Zero or more", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "How many outputs must an algorithm produce according to the Output property?", "opts": ["Zero or more", "Exactly one", "At least one (one or more)", "Exactly two"], "a": 2, "id": "ds-w2-fc2830caefac", "e": "Key answer: At least one (one or more)", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The mnemonic FDEIO stands for the five properties. What does \"E\" stand for?", "opts": nal quiz bank"}, {"t": "mc", "q": "A Learning Management System handles:", "opts": ["Accounts and transactions", "Patient records", "Courses, activities, submissions, and grades", "Enrollment and scheduling only"], "a": 2, "id": "pm-w2-df702c2a91b9", "e": "Key answer: Courses, activities, submissions, and grades", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "An IS Project is BEST defined as:", "opts": ["An ongoing operational activity", "A temporary effort to create, improve, replace, integrate, or implement an IS or related capability", "A permanent department", "A routine system maintenance task"], "a": 1, "id": "pm-w2-7854c11647e5", "e": "Key answer: A temporary effort to create, improve, replace, integrate, or implement an IS or related capability", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What provides the structure for organizing work needed to achieve an IS project's intended result?", "opts": ["Hardware procurement", "Project management", "Marketing strategy", "Database design"], "a": 1, "id": "pm-w2-689ef56141f5", "e": "Key answer: Project management", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "In the flow Business Need → __ → IS Solution → Value, what fills the blank?", "opts": ["IS Operation", "IS Project", "IS Component", "IT Service"], "a": 1, "id": "pm-w2-46aaa3f69f0c", "e": "Key answer: IS Project", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A project is best defined as:", "opts": ["An ongoing repetitive activity", "A permanent organizational structure", "A temporary endeavor to create a unique product, service, or result", "A daily operational task"], "a": 2, "id": "pm-w2-6465fd6b0946", "e": "Key answer: A temporary endeavor to create a unique product, service, or result", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What does \"Temporary\" mean for a project?", "opts": ["The project can be cancelled anytime", "The project h rity Implementation"], "a": 2, "id": "pm-w3-0266a89d20eb", "e": "Key answer: Employee Orientation", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Is technology always the main reason an IT project fails?", "opts": ["Yes, always", "No — people, processes, management, and organizational factors can also contribute", "Only budget causes failure", "Changing requirements are always the sole cause"], "a": 1, "id": "pm-w3-728c9bc8d1cd", "e": "Key answer: No — people, processes, management, and organizational factors can also contribute", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The Software Crisis refers to:", "opts": ["A shortage of programmers", "Difficulties in developing and maintaining software as systems became increasingly large, complex, and demanding", "A specific computer virus outbreak", "The failure of a single company"], "a": 1, "id": "pm-w3-e725be77bcdb", "e": "Key answer: Difficulties in developing and maintaining software as systems became increasingly large, complex, and demanding", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which is NOT a symptom of the Software Crisis?", "opts": ["Schedule Problems", "Cost Problems", "Projects finish ahead of schedule", "Maintenance Problems"], "a": 2, "id": "pm-w3-d46bca22dc08", "e": "Key answer: Projects finish ahead of schedule", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "\"Development takes longer than expected\" is which Software Crisis symptom?", "opts": ["Cost Problems", "Quality Problems", "Schedule Problems", "Maintenance Problems"], "a": 2, "id": "pm-w3-3697ec1b6d04", "e": "Key answer: Schedule Problems", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "\"Project costs exceed the budget\" is which Software Crisis symptom?", "opts": ["Schedule Problems", "Cost Problems", "Quality Problems", "Requirement Problems"], "a": 1, "id": "pm-w3-4f087aa2bb74", "e": "Key answer: Cost Problems", "kind": enced programmers can prevent failure"], "a": 2, "id": "pm-w3-1502a0c2fb50", "e": "Key answer: Good technology alone does NOT guarantee a successful software project", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Software Project Management (SPM) involves:", "opts": ["Only writing code", "Applying project management principles and practices to software development projects", "Only managing licenses", "Only testing software"], "a": 1, "id": "pm-w3-87d1d64b2fd7", "e": "Key answer: Applying project management principles and practices to software development projects", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The Software Project Manager must understand which four areas?", "opts": ["Hardware, Software, Networks, Data", "People, Process, Technology, Business", "Scope, Time, Cost, Quality", "Initiate, Plan, Execute, Close"], "a": 1, "id": "pm-w3-db7d72b1be17", "e": "Key answer: People, Process, Technology, Business", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What does ITIL stand for?", "opts": ["Information Technology Integrated Library", "Information Technology Infrastructure Library", "Integrated Technology Infrastructure Library", "Information Technology Implementation Lifecycle"], "a": 1, "id": "pm-w3-db4c290fea23", "e": "Key answer: Information Technology Infrastructure Library", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "ITIL is a framework of practices for:", "opts": ["Software development only", "Project management only", "IT service management", "Hardware procurement"], "a": 2, "id": "pm-w3-c21223e28dce", "e": "Key answer: IT service management", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The correct distinction between Project Management and IT Service Management is:", "opts": ["Both focus on temporary objectives", "Project Management focuses on temporary objectives; IT Service Management focuses on delivering and managing ongoing IT m-w5-917070758423", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Formal finalization of work and the project", "opts": ["Project closure", "Constraint", "Deliverable", "Objective"], "a": 0, "e": "Project closure: Formal finalization of work and the project", "source": "PDF lesson coverage", "id": "pm-w5-95d036b99150", "kind": "recall"}, {"t": "mc", "q": "A team needs formal authorization and an assigned manager before detailed planning. Which document provides initial direction?", "opts": ["Project charter", "Only actual expenditure", "Only the business case", "Only a test report"], "a": 0, "e": "The charter establishes and authorizes the project.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-f785cf36ebe8"}, {"t": "mc", "q": "Payroll is added informally to an enrollment project's agreed work. Which issue is illustrated?", "opts": ["Only a naming change", "A approved baseline by definition", "Project closure", "Scope creep"], "a": 3, "e": "Uncontrolled new functionality expands the scope.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-9ad927b95eb2"}, {"t": "mc", "q": "Planning assumes staff will be available next semester. What category is this?", "opts": ["Assumption", "Actual variance", "Constraint", "Completed deliverable"], "a": 0, "e": "An assumption is a planning belief, not a guaranteed fact.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-f10e2e68e1b2"}, {"t": "mc", "q": "A budget cannot exceed ₱500,000. What category is this?", "opts": ["Assumption only", "User preference only", "Constraint", "Delivered feature"], "a": 2, "e": "A fixed budget limits the project.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-3be848d96f29"}, {"t": "mc", "q": "The approved budget is ₱500,000; actual cost is ₱575,000. How far above budget is it?", "opts": ["₱75,000, or 15%", "₱75,000, or 75%", "₱25,000, or 5%", "₱575,000, or 100%"], "a": 0, "e": "75,000 divided by 500,000 is 0.15.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-eb556dc589a4"}, {"t": "mc", "q": "The plan lists 20 features; 18 are delivered. What can be concluded from count alone?", "opts": ["Every feature has equal value and quality", "The project is definitely accepted", "Two fewer features and 90% of the planned count", "Cost is definitely 90% of budget"], "a": 2, "e": "A feature count alone does not determine quality or acceptance.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-a5dc8f8ac839"}, {"t": "mc", "q": "Completion moves from December to January. What is established by these labels alone?", "opts": ["No schedule variance exists", "Completion is later; exact delay in days is unspecified", "The delay is exactly 31 days", "Completion is early"], "a": 1, "e": "Dates are needed to calculate exact days.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-19cf07c507d1"}, {"t": "mc", "q": "A manager silently changes the baseline to match an overrun. What is the appropriate practice?", "opts": ["Ignore actual cost", "Only change the report colors", "Always erase the original plan", "Use approved change control and preserve an honest performance reference"], "a": 3, "e": "A baseline is an approved reference, not a way to conceal variance.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-4810750f050a"}, {"t": "mc", "q": "A team produces a user manual. How should this be classified?", "opts": ["Constraint only", "Risk only", "Stakeholder", "Deliverable"], "a": 3, "e": "It is a tangible project output.", "kind": "situational", "source": "PDF-based practice", "id": "pm-w5-4160a63bb240"}]}, {"id": "im-w2", "subject": "im", "week": "Week 2", "title": "IM Concepts, Databases & File Systems", "questions": [{"t": "mc", "q": "In the supplied lesson timeline, who is associated with early computerized database work around 1960?", "opts": ["E. F. Codd", "Alan Turing", "Charles Bachman", "Grace Hopper"], "a": 2, "id": "im-w2-065f49447d57", "e": "Key answer: Charles Bachman", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Who released the paper \"A Relational Model of Data for Large Shared Data Banks\" (1970)?", "opts": ["Charles Bachman", "E. F. Codd", "Tim Berners-Lee", "Edgar Dijkstra"], "a": 1, "id": "im-w2-2a1a98c6018f", "e": "Key answer: E. F. Codd", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which database language is associated with the 1980s growth and standardization stage in the lesson?", "opts": ["HTML", "XML", "SQL", "Python"], "a": 2, "id": "im-w2-f0eec3b70caf", "e": "Key answer: SQL", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which of the following is a disadvantage of a File System?", "opts": ["Data independence", "Less redundancy", "Program-Data Dependence", "Multiuser access"], "a": 2, "id": "im-w2-3fd2a905af0e", "e": "Key answer: Program-Data Dependence", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "How many disadvantages of a File System are listed in the material?", "opts": ["3", "4", "5", "6"], "a": 2, "id": "im-w2-8cef619c8a5c", "e": "Key answer: 5", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which File System disadvantage means \"the same data may be stored multiple times\"?", "opts": ["Program-Data Dependence", "Limited Data Sharing", "Duplication of Data", "Excessive Program Maintenance"], "a": 2, "id": "im-w2-40d063b23cd7", "e": "Key answer: Duplication of Data", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which File System disadvantage means \"information is difficult to share across different users/programs\"?", "opts": ["Program-Data Dependence", "Limited Data Sharing", "Duplication of Data", "Lengthy Development Times"], "a": 1, "id": "im-w2-ce788d6426fa", "e": "Key answer: Limited Data Sharing", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Database is best defined as:", "opts": ["A single table of data", "A shared collection of related data used to support the activities of a particular organization", "A programming language", "A type of hardware"], "a": 1, "id": "im-w2-f8d5719897d7", "e": "Key answer: A shared collection of related data used to support the activities of a particular organization", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "How many major parts make up a Database System?", "opts": ["3", "4", "5", "6"], "a": 2, "id": "im-w2-dc10f38e2b6b", "e": "Key answer: 5", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which is NOT a major part of a Database System?", "opts": ["Hardware", "Software", "Marketing", "People"], "a": 2, "id": "im-w2-22232f9cbbda", "e": "Key answer: Marketing", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A DBMS stores data in a way that makes it easier to:", "opts": ["Print reports only", "Retrieve, manipulate, and produce information", "Buy and sell data", "Write programming code"], "a": 1, "id": "im-w2-5e7655405483", "e": "Key answer: Retrieve, manipulate, and produce information", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which is NOT a characteristic of a DBMS listed in the material?", "opts": ["Less Redundancy", "Consistency", "ACID Properties", "Program-Data Dependence"], "a": 3, "id": "im-w2-4803ee6654e5", "e": "Key answer: Program-Data Dependence", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A location where an individual data item is stored is called:", "opts": ["Table", "Record", "Field", "Schema"], "a": 2, "id": "im-w2-a2d6c0adcc6a", "e": "Key answer: Field", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A combination of fields forms a:", "opts": ["Record", "Table", "Field", "Database"], "a": 1, "id": "im-w2-09beeb645f2c", "e": "Key answer: Table", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "What does SQL stand for?", "opts": ["Structured Query Language", "Simple Query Library", "Standard Queue Language", "System Query Link"], "a": 0, "id": "im-w2-a8f7061ec873", "e": "Key answer: Structured Query Language", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Information Management is best described as:", "opts": ["Only the technology used to store data", "The infrastructure used to collect, manage, preserve, store, and deliver information", "Only the software used by a company", "Only the hardware used to store data"], "a": 1, "id": "im-w2-d87bfe9f2681", "e": "Key answer: The infrastructure used to collect, manage, preserve, store, and deliver information", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Information Management is more than technology. It also includes:", "opts": ["Only hardware and software", "Business processes, organizational practices, information architecture, metadata, content quality, and the information itself", "Only policies", "Only databases"], "a": 1, "id": "im-w2-bd31a81f7621", "e": "Key answer: Business processes, organizational practices, information architecture, metadata, content quality, and the information itself", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The key idea of \"Information as an Asset\" means:", "opts": ["Information has no monetary value", "All information (digital and physical) is an asset that requires proper management", "Only digital information is an asset", "Information assets are only financial records"], "a": 1, "id": "im-w2-e20a69a36bd5", "e": "Key answer: All information (digital and physical) is an asset that requires proper management", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The purpose of Information Management is:", "opts": ["To design, develop, manage, and use information with insight and innovation, and to support decision-making and create value", "To only store data in databases", "To sell information to third parties", "To only manage hardware assets"], "a": 0, "id": "im-w2-7ac1b41c8da1", "e": "Key answer: To design, develop, manage, and use information with insight and innovation, and to support decision-making and create value", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DBMS characteristic means \"multiple users can access the database\"?", "opts": ["Security", "Less Redundancy", "Multiuser and Concurrent Access", "Query Language"], "a": 2, "id": "im-w2-863d3f71d18a", "e": "Key answer: Multiuser and Concurrent Access", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "In the supplied lesson timeline, early computerized-database work around 1960 is associated with Charles _______.", "a": 3, "id": "im-w2-e788cc4bc18d", "e": "Key answer: bachman", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["bachman"], "opts": ["Turing", "Codd", "Babbage", "bachman"]}, {"t": "mc", "q": "E. F. Codd introduced the Relational Model in _______.", "a": 0, "id": "im-w2-f371f80f43f5", "e": "Key answer: 1970", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["1970"], "opts": ["1970", "1968", "1972", "1971"]}, {"t": "mc", "q": "SQL stands for Structured _______ Language.", "a": 3, "id": "im-w2-53b8fb432597", "e": "Key answer: query", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["query"], "opts": ["manipulation", "definition", "control", "query"]}, {"t": "mc", "q": "The five disadvantages of a File System are: Program-Data Dependence, Duplication of Data, Limited Data Sharing, Lengthy Development Times, and Excessive Program _______.", "a": 1, "id": "im-w2-12548b312674", "e": "Key answer: maintenance", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["maintenance"], "opts": ["marketing", "maintenance", "management", "measurement"]}, {"t": "mc", "q": "A _______ is a shared collection of related data used to support an organization's activities.", "a": 2, "id": "im-w2-c218053506f2", "e": "Key answer: database", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["database"], "opts": ["network", "application interface", "database", "algorithm"]}, {"t": "mc", "q": "A Database Management System is abbreviated _______.", "a": 2, "id": "im-w2-cdf0662e6cb7", "e": "Key answer: dbms, DBMS", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["dbms", "DBMS"], "opts": ["DDL", "DML", "dbms", "DCL"]}, {"t": "mc", "q": "The five major parts of a Database System are Hardware, Software, People, Procedures, and _______.", "a": 3, "id": "im-w2-9e5b2b2a88f5", "e": "Key answer: data", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["data"], "opts": ["reports", "networks", "queries", "data"]}, {"t": "mc", "q": "The Data Item → _______ → Table relationship shows the structure of a database.", "a": 1, "id": "im-w2-a48243c61ad4", "e": "Key answer: field", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["field"], "opts": ["index", "field", "database", "relationship"]}, {"t": "mc", "q": "Information Management allows information to be available to the right _______ at the right time.", "a": 3, "id": "im-w2-07b65514295a", "e": "Key answer: people", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["people"], "opts": ["devices", "programs", "formats", "people"]}, {"t": "mc", "q": "The five IM activities are: Collect, Manage, Preserve, Store, and _______.", "a": 2, "id": "im-w2-11e912ccc309", "e": "Key answer: deliver", "kind": "recall", "source": "Original quiz bank", "acceptedOriginalAnswers": ["deliver"], "opts": ["duplicate", "encrypt", "deliver", "erase"]}, {"t": "mc", "q": "Which term matches this definition? Information describing other information, such as author, date or format", "opts": ["End user", "Content quality", "Consistency", "Metadata"], "a": 3, "e": "Metadata: Information describing other information, such as author, date or format", "source": "PDF lesson coverage", "id": "im-w2-6d631c986de1", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The organization and structure of information", "opts": ["Database designer", "Isolation", "Information architecture", "Durability"], "a": 2, "e": "Information architecture: The organization and structure of information", "source": "PDF lesson coverage", "id": "im-w2-96df90fe4e8e", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Information with value that requires proper management", "opts": ["End user", "Procedures", "Information asset", "Durability"], "a": 2, "e": "Information asset: Information with value that requires proper management", "source": "PDF lesson coverage", "id": "im-w2-e4b617af0a37", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Rules and processes for using and managing a database system", "opts": ["Information architecture", "End user", "Procedures", "Information asset"], "a": 2, "e": "Procedures: Rules and processes for using and managing a database system", "source": "PDF lesson coverage", "id": "im-w2-a45f701865a8", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The accuracy, completeness and usefulness of information", "opts": ["Metadata", "Isolation", "Content quality", "Consistency"], "a": 2, "e": "Content quality: The accuracy, completeness and usefulness of information", "source": "PDF lesson coverage", "id": "im-w2-39ff809a5a0a", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A transaction takes effect completely or not at all", "opts": ["Atomicity", "Information asset", "Procedures", "Consistency"], "a": 0, "e": "Atomicity: A transaction takes effect completely or not at all", "source": "PDF lesson coverage", "id": "im-w2-886b4afc565a", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A transaction preserves declared database rules and valid states", "opts": ["End user", "Consistency", "Durability", "Information asset"], "a": 1, "e": "Consistency: A transaction preserves declared database rules and valid states", "source": "PDF lesson coverage", "id": "im-w2-73699362aefb", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Concurrent transactions are managed so they do not improperly interfere", "opts": ["Information asset", "Database administrator", "Isolation", "Durability"], "a": 2, "e": "Isolation: Concurrent transactions are managed so they do not improperly interfere", "source": "PDF lesson coverage", "id": "im-w2-b1a975fde295", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Successfully committed changes survive a later crash", "opts": ["Durability", "Consistency", "Program-data dependence", "Information asset"], "a": 0, "e": "Durability: Successfully committed changes survive a later crash", "source": "PDF lesson coverage", "id": "im-w2-1ce904ef9381", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Programs need modification when the file structure they depend on changes", "opts": ["Information asset", "Program-data dependence", "Data inconsistency", "Information architecture"], "a": 1, "e": "Program-data dependence: Programs need modification when the file structure they depend on changes", "source": "PDF lesson coverage", "id": "im-w2-8e8ade9c7d81", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Different copies of the same fact disagree", "opts": ["Content quality", "Data inconsistency", "Metadata", "Isolation"], "a": 1, "e": "Data inconsistency: Different copies of the same fact disagree", "source": "PDF lesson coverage", "id": "im-w2-0841cc375913", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The person who defines tables, attributes and relationships", "opts": ["Database designer", "Atomicity", "Durability", "Procedures"], "a": 0, "e": "Database designer: The person who defines tables, attributes and relationships", "source": "PDF lesson coverage", "id": "im-w2-b2efb0874c02", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The role managing database access, operation and maintenance", "opts": ["Database designer", "Program-data dependence", "Database administrator", "Data inconsistency"], "a": 2, "e": "Database administrator: The role managing database access, operation and maintenance", "source": "PDF lesson coverage", "id": "im-w2-ddd3b659e066", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A person using database information or applications", "opts": ["Metadata", "Durability", "End user", "Isolation"], "a": 2, "e": "End user: A person using database information or applications", "source": "PDF lesson coverage", "id": "im-w2-4cd9bf5e8f93", "kind": "recall"}, {"t": "mc", "q": "A university stores student information in separate spreadsheets maintained by the Registrar, Accounting, and Guidance Offices. When a student changes surname, each office must update its own file. Which file-system disadvantage is most directly demonstrated?", "opts": ["Limited data sharing", "Duplication of data", "Lengthy development time", "Excessive program maintenance"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q1 · PDF p.79", "originalLetter": "B", "e": "Multiple copies of the same student information are stored in separate files.", "id": "im-w2-44f362eb905b"}, {"t": "mc", "q": "Accounting updates a student address, but the Registrar file still contains the old address. Which problem is now evident?", "opts": ["Data abstraction", "Data independence", "Data inconsistency", "Data concurrency"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q2 · PDF p.79", "originalLetter": "C", "e": "The copies of the same fact now disagree.", "id": "im-w2-e5dede3ce2cf"}, {"t": "mc", "q": "A school replaces separate departmental files with a shared database accessible to authorized offices. Which statement best describes the improvement?", "opts": ["Each department maintains a separate copy of the same information.", "Every user can modify all information without restrictions.", "Related data can be managed centrally and accessed by different authorized users.", "Application programs no longer need to retrieve information from storage."], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q3 · PDF p.80", "originalLetter": "C", "e": "Shared data can serve authorized users without uncontrolled copies or unrestricted modification.", "id": "im-w2-0fd9ea0671f7"}, {"t": "mc", "q": "A developer changes a customer file structure. Several programs must be modified because they depend on the original layout. What disadvantage does this illustrate?", "opts": ["Program-data dependence", "Multiuser access", "Data durability", "Multiple views"], "a": 0, "kind": "sample", "source": "Provided answer key · Set 1 · Q4 · PDF p.80", "originalLetter": "A", "e": "Applications are tightly coupled to the file structure.", "id": "im-w2-b8ab9ac4d404"}, {"t": "mc", "q": "Which situation best demonstrates that information management is more than installing software?", "opts": ["Purchasing a faster database server", "Increasing computer storage capacity", "Establishing procedures for collecting, validating, preserving, and providing access to information", "Replacing paper documents with scans without changing existing procedures"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q5 · PDF p.80", "originalLetter": "C", "e": "Information management includes policies and processes as well as technology.", "id": "im-w2-8700f603992f"}, {"t": "mc", "q": "A university database contains connected student, enrollment, course, and grade records used for academic operations. Which database characteristic is illustrated?", "opts": ["A collection of unrelated files", "A shared collection of related data for a specific purpose", "Only information already processed into reports", "Information accessible to every employee"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q6 · PDF p.81", "originalLetter": "B", "e": "A database is related, purposeful data rather than an unrestricted collection of unrelated files.", "id": "im-w2-c1f8ef8ff47b"}, {"t": "mc", "q": "A professor enters grades, a student views grades, and a registrar updates enrollment information. Which statement is correct?", "opts": ["Only the student is an end user.", "Only the professor and registrar are end users.", "All three may be end users of the database system.", "None is an end user because they do not manage the database server."], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q7 · PDF p.81", "originalLetter": "C", "e": "End users interact with data or applications; they need not administer the server.", "id": "im-w2-4f6280a67d48"}, {"t": "mc", "q": "A university hires someone to define tables, attributes, and relationships for a new enrollment database. Which role matches this responsibility?", "opts": ["Database administrator", "Database designer", "System administrator", "End user"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q8 · PDF p.81", "originalLetter": "B", "e": "The designer specifies the structure and relationships.", "id": "im-w2-c3c6a1c9846a"}, {"t": "mc", "q": "Which is NOT one of the five major parts of a database system?", "opts": ["Hardware", "Procedures", "People", "Internet connection"], "a": 3, "kind": "sample", "source": "Provided answer key · Set 1 · Q9 · PDF p.82", "originalLetter": "D", "e": "The lesson groups components as hardware, software, people, procedures, and data.", "id": "im-w2-ed1b2b7255fe"}, {"t": "mc", "q": "A student submits an enrollment transaction. The system crashes immediately afterward, but the successfully committed enrollment remains after recovery. Which ACID property is illustrated?", "opts": ["Atomicity", "Consistency", "Isolation", "Durability"], "a": 3, "kind": "sample", "source": "Provided answer key · Set 1 · Q10 · PDF p.82", "originalLetter": "D", "e": "Durability protects committed effects after a later failure.", "id": "im-w2-2fb45ac122be"}, {"t": "mc", "q": "Two cashiers access the same database while processing separate transactions. The DBMS manages operations so concurrent use does not improperly interfere. Which capability is demonstrated?", "opts": ["Multiple views and data abstraction", "Multiuser and concurrent access", "Data duplication and redundancy", "Physical schema modification"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q11 · PDF p.82", "originalLetter": "B", "e": "The DBMS coordinates concurrent database users and transactions.", "id": "im-w2-203859db5f0f"}, {"t": "mc", "q": "A bank transfer debits one account but fails before crediting the other. Which ACID property requires undoing the debit?", "opts": ["Atomicity", "Durability", "Metadata", "Multiple views"], "a": 0, "e": "The transfer must complete as a whole or have no effect.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-f707dba0089b"}, {"t": "mc", "q": "A transaction tries to store a negative balance despite a declared balance rule. Which ACID goal requires preserving valid rules?", "opts": ["Duplication", "Physical independence", "Consistency", "Durability"], "a": 2, "e": "Transactions must maintain declared integrity constraints.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-6c10e039afb3"}, {"t": "mc", "q": "Two clerks update stock at the same time. The DBMS prevents one from reading the other's incomplete change. Which ACID property is relevant?", "opts": ["Data duplication", "Isolation", "Durability", "Schema"], "a": 1, "e": "Concurrent transactions should not expose inappropriate intermediate states.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-5e2cc85039d7"}, {"t": "mc", "q": "A library buys scanning software but defines no retention rules or access responsibilities. What is the main missing IM element?", "opts": ["A larger screen alone", "A second scanner alone", "A different file extension", "Processes and governance for information"], "a": 3, "e": "Information management also requires practices, procedures and responsibility.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-2d50134d17cf"}, {"t": "mc", "q": "A report records its author, creation date and document version. What are those descriptive fields?", "opts": ["Metadata", "Transaction values", "Application programs", "Physical devices"], "a": 0, "e": "Metadata describes the information resource.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-1f42aeed78ff"}, {"t": "mc", "q": "A university groups records by purpose and makes their locations discoverable. Which IM concern is involved?", "opts": ["Programming syntax", "Durability only", "Information architecture", "Network bandwidth only"], "a": 2, "e": "Architecture concerns organization and structure of information.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-f40043279a64"}, {"t": "mc", "q": "Two files store the same enrollment fact even while their values agree. What issue already exists?", "opts": ["Data inconsistency necessarily", "Transaction failure necessarily", "Foreign-key violation", "Data redundancy"], "a": 3, "e": "Redundancy means repeated data; inconsistency occurs when copies disagree.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-1eeffa5d2a5c"}, {"t": "mc", "q": "Employees can read financial records without authorization. Which DBMS characteristic needs improvement?", "opts": ["Physical size", "Duplication", "Field length only", "Security"], "a": 3, "e": "Access should be controlled by authorization.", "kind": "situational", "source": "PDF-based practice", "id": "im-w2-d89a15887cca"}, ogical → View", "Internal → Conceptual → External", "View → Logical → Physical", "Conceptual → View → Physical"], "a": 2, "id": "im-w3-a6846a30afa6", "e": "Key answer: View → Logical → Physical", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The External Level in Three-Level Architecture corresponds to which Data Abstraction level?", "opts": ["Physical Level", "Logical Level", "View Level", "Instance Level"], "a": 2, "id": "im-w3-1ba33c5b6872", "e": "Key answer: View Level", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The Conceptual Level corresponds to which Data Abstraction level?", "opts": ["View Level", "Logical Level", "Physical Level", "Instance Level"], "a": 1, "id": "im-w3-7f72a7722c16", "e": "Key answer: Logical Level", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "The Internal Level corresponds to which Data Abstraction level?", "opts": ["View Level", "Logical Level", "Physical Level", "Instance Level"], "a": 2, "id": "im-w3-e05bf7143f5c", "e": "Key answer: Physical Level", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Schema is best defined as:", "opts": ["The data stored in a database at a moment in time", "The design of a database", "A type of query language", "A database user role"], "a": 1, "id": "im-w3-1b692b79d60b", "e": "Key answer: The design of a database", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "An Instance is best defined as:", "opts": ["The design of a database", "The blueprint of a database", "The data stored in a database at a particular moment in time", "A type of schema"], "a": 2, "id": "im-w3-b71bc0568ac9", "e": "Key answer: The data stored in a database at a particular moment in time", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Schema is to Design as Instance is to:", "opts": ["Blueprint", "Snapshot/Data at a particular moment", "Structure", "Language"], "a": 1, "id": "im-w3-65597b5bbf83", ement with interface, application processing and database on one tier", "opts": ["Three-tier architecture", "Single-tier architecture", "Two-tier architecture", "Schema"], "a": 1, "e": "Single-tier architecture: An arrangement with interface, application processing and database on one tier", "source": "PDF lesson coverage", "id": "im-w3-c239abb83aad", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A client application communicates directly with the database server", "opts": ["Two-tier architecture", "Schema", "Instance", "Conceptual level"], "a": 0, "e": "Two-tier architecture: A client application communicates directly with the database server", "source": "PDF lesson coverage", "id": "im-w3-d73f1d6d2699", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Client interface, application server and database server are separated", "opts": ["Data abstraction", "Three-tier architecture", "Internal level", "External level"], "a": 1, "e": "Three-tier architecture: Client interface, application server and database server are separated", "source": "PDF lesson coverage", "id": "im-w3-add9958f4507", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? User-specific views of a database", "opts": ["Instance", "External level", "Internal level", "Schema"], "a": 1, "e": "External level: User-specific views of a database", "source": "PDF lesson coverage", "id": "im-w3-9a0f8d27b667", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The logical structure of the overall database", "opts": ["Three-tier architecture", "Internal level", "Conceptual level", "Data abstraction"], "a": 2, "e": "Conceptual level: The logical structure of the overall database", "source": "PDF lesson coverage", "id": "im-w3-adef503b92dc", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Physical organization and storage details of the database", "opts": ["Three-tier architecture", "External level", "Instance", "Internal level"], "a": 3, "e": "Internal level: Physical organization and storage details of the database", "source": "PDF lesson coverage", "id": "im-w3-ba2f9c9c4a80", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The structure or design of a database", "opts": ["Internal level", "Schema", "Conceptual level", "Three-tier architecture"], "a": 1, "e": "Schema: The structure or design of a database", "source": "PDF lesson coverage", "id": "im-w3-423b872c3be8", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The data held at a particular moment, a database snapshot", "opts": ["Instance", "Schema", "Conceptual level", "External level"], "a": 0, "e": "Instance: The data held at a particular moment, a database snapshot", "source": "PDF lesson coverage", "id": "im-w3-c6e8f5283bbf", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Hiding lower-level details using physical, logical and view layers", "opts": ["Data abstraction", "Conceptual level", "Internal level", "External level"], "a": 0, "e": "Data abstraction: Hiding lower-level details using physical, logical and view layers", "source": "PDF lesson coverage", "id": "im-w3-d28b0d2959bf", "kind": "recall"}, {"t": "mc", "q": "In a two-tier database architecture, which arrangement best matches the architecture?", "opts": ["Client communicates with an application server, then a database server.", "Client-side application communicates directly with the database server.", "Database server communicates only with another database server.", "User accesses the database without a client application or DBMS."], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q12 · PDF p.83", "originalLetter": "B", "e": "Two-tier architecture places the client directly in contact with the database server.", "id": "im-w3-229368a59b33"}, {"t": "mc", "q": "A web enrollment system separates user interface, application processing, and database storage into three tiers. Where should application processing primarily occur?", "opts": ["Client tier", "Application tier", "Database tier", "External schema"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q13 · PDF p.83", "originalLetter": "B", "e": "The middle application tier handles the application logic.", "id": "im-w3-11cdc3a83434"}, {"t": "mc", "q": "A registrar sees grades and enrollment details; a student sees only their own grades. Both access the same database. Which three-level architecture level provides user-specific views?", "opts": ["Internal level", "Physical level", "Conceptual level", "External level"], "a": 3, "kind": "sample", "source": "Provided answer key · Set 1 · Q14 · PDF p.83", "originalLetter": "D", "e": "External views expose different portions of the same underlying database.", "id": "im-w3-cfc3d9e24e03"}, {"t": "mc", "q": "A database designer defines STUDENT, COURSE, and ENROLLMENT tables and their relationships. Which architecture level is most directly involved?", "opts": ["External level", "Conceptual level", "Internal level", "User interface level"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q15 · PDF p.84", "originalLetter": "B", "e": "The conceptual level describes the overall logical database structure.", "id": "im-w3-ff73c6a65945"}, {"t": "mc", "q": "A DBA changes how records are physically stored on disk to improve performance. Which level is directly affected?", "opts": ["External level", "View level", "Internal level", "Conceptual level"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q16 · PDF p.84", "originalLetter": "C", "e": "The internal level describes physical storage details.", "id": "im-w3-14f87af9c0a7"}, {"t": "mc", "q": "A STUDENT table has Student_ID, Name, and Course. Tomorrow, 50 additional rows are inserted without changing the table structure. What changed?", "opts": ["Schema only", "Instance only", "Both schema and instance necessarily change z bank"}, {"t": "mc", "q": "Which DDL command creates objects in the database?", "opts": ["ALTER", "DROP", "CREATE", "TRUNCATE"], "a": 2, "id": "im-w4-fe934b815ffa", "e": "Key answer: CREATE", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DDL command alters the structure of the database?", "opts": ["CREATE", "DROP", "ALTER", "TRUNCATE"], "a": 2, "id": "im-w4-9758dca63659", "e": "Key answer: ALTER", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DDL command deletes objects from the database?", "opts": ["CREATE", "ALTER", "TRUNCATE", "DROP"], "a": 3, "id": "im-w4-4fcaf3fe4af5", "e": "Key answer: DROP", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DDL command removes all records from a table?", "opts": ["DROP", "ALTER", "TRUNCATE", "DELETE"], "a": 2, "id": "im-w4-1212d97c9561", "e": "Key answer: TRUNCATE", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DML command retrieves data from a database?", "opts": ["INSERT", "UPDATE", "DELETE", "SELECT"], "a": 3, "id": "im-w4-8945bd9e05a1", "e": "Key answer: SELECT", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DML command adds data into a table?", "opts": ["SELECT", "INSERT", "UPDATE", "DELETE"], "a": 1, "id": "im-w4-e8344a92361a", "e": "Key answer: INSERT", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DML command modifies existing data in a table?", "opts": ["SELECT", "INSERT", "UPDATE", "DELETE"], "a": 2, "id": "im-w4-0061510c7139", "e": "Key answer: UPDATE", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DCL command gives a user access privileges?", "opts": ["REVOKE", "GRANT", "ALTER", "DROP"], "a": 1, "id": "im-w4-c51a1ef78582", "e": "Key answer: GRANT", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which DCL command takes back permissions from a user?", "opts": ["GRANT", "DROP", "REVOKE", "DELETE"],  data model", "Object-based data model", "TRUNCATE", "CREATE"], "a": 0, "e": "Relational data model: A model organizing data into tables with rows and columns", "source": "PDF lesson coverage", "id": "im-w4-1931880bc556", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A model allowing flexible tagged or nested data rather than one rigid table structure", "opts": ["DELETE", "Relational data model", "ALTER", "Semistructured data model"], "a": 3, "e": "Semistructured data model: A model allowing flexible tagged or nested data rather than one rigid table structure", "source": "PDF lesson coverage", "id": "im-w4-ea7dd832fbc3", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? A model organizing information around objects and their properties", "opts": ["Object-based data model", "TCL", "REVOKE", "GRANT"], "a": 0, "e": "Object-based data model: A model organizing information around objects and their properties", "source": "PDF lesson coverage", "id": "im-w4-536f05aaaaec", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Changing the conceptual schema without requiring changes to external views", "opts": ["DELETE", "Logical data independence", "DCL", "REVOKE"], "a": 1, "e": "Logical data independence: Changing the conceptual schema without requiring changes to external views", "source": "PDF lesson coverage", "id": "im-w4-05ec36982c57", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? Changing internal storage without requiring logical-schema changes", "opts": ["REVOKE", "DROP", "UPDATE", "Physical data independence"], "a": 3, "e": "Physical data independence: Changing internal storage without requiring logical-schema changes", "source": "PDF lesson coverage", "id": "im-w4-492c75e6dae3", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The language category defining database structures and objects", "opts": ["TCL", "DROP", "TRUNCATE", "DDL"], "a": 3, "e": "DDL: The language category defining database structures and objects", "source": "PDF lesson coverage", "id": "im-w4-d932af91aa66", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The language category retrieving and manipulating stored records", "opts": ["DML", "Relational data model", "INSERT", "DDL"], "a": 0, "e": "DML: The language category retrieving and manipulating stored records", "source": "PDF lesson coverage", "id": "im-w4-bf147e8ce9eb", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The language category controlling user privileges", "opts": ["UPDATE", "Entity-relationship model", "DCL", "DML"], "a": 2, "e": "DCL: The language category controlling user privileges", "source": "PDF lesson coverage", "id": "im-w4-dd2c8815d47b", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The language category managing transactions, including COMMIT and ROLLBACK", "opts": ["DELETE", "CREATE", "INSERT", "TCL"], "a": 3, "e": "TCL: The language category managing transactions, including COMMIT and ROLLBACK", "source": "PDF lesson coverage", "id": "im-w4-ca214116fffc", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command used to define a new database object", "opts": ["DML", "Relational data model", "SELECT", "CREATE"], "a": 3, "e": "CREATE: The command used to define a new database object", "source": "PDF lesson coverage", "id": "im-w4-f51bde230972", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command changing an existing table's structure", "opts": ["ALTER", "DROP", "GRANT", "Relational data model"], "a": 0, "e": "ALTER: The command changing an existing table's structure", "source": "PDF lesson coverage", "id": "im-w4-d105d1340b96", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command removing a database object such as an entire table", "opts": ["DML", "TCL", "DROP", "GRANT"], "a": 2, "e": "DROP: The command removing a database object such as an entire table", "source": "PDF lesson coverage", "id": "im-w4-08da32a47847", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command adding new rows", "opts": ["INSERT", "SELECT", "UPDATE", "Relational data model"], "a": 0, "e": "INSERT: The command adding new rows", "source": "PDF lesson coverage", "id": "im-w4-d82bd342b466", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command changing values in existing rows", "opts": ["SELECT", "DELETE", "UPDATE", "Logical data independence"], "a": 2, "e": "UPDATE: The command changing values in existing rows", "source": "PDF lesson coverage", "id": "im-w4-9c17f05c48ba", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command retrieving rows or expressions", "opts": ["Relational data model", "SELECT", "DELETE", "Semistructured data model"], "a": 1, "e": "SELECT: The command retrieving rows or expressions", "source": "PDF lesson coverage", "id": "im-w4-e7f353e7b41f", "kind": "recall"}, {"t": "mc", "q": "Which term matches this definition? The command removing rows and optionally restricting them with WHERE", "opts": ["DELETE", "UPDATE", "DCL", "ALTER"], "a": 0, "e": "DELETE: The command removing rows and optionally restricting them with WHERE", "source": "PDF lesson coverage", "id": "im-w4-b6b1a076a0ca", "kind": "recall"}, {"t": "mc", "q": "A university changes its physical storage arrangement without requiring changes to logical table definitions used by applications. What concept is demonstrated?", "opts": ["Logical data independence", "Physical data independence", "Referential integrity", "Program-data dependence"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q19 · PDF p.85", "originalLetter": "B", "e": "Physical changes do not force logical schema changes.", "id": "im-w4-bb42b9977a78"}, {"t": "mc", "q": "A designer modifies the logical schema while preserving external views used by existing applications. What concept is demonstrated?", "opts": ["Logical data independence", "Physical data independence", "Transaction isolation", "Data redundancy"], "a": 0, "kind": "sample", "source": "Provided answer key · Set 1 · Q20 · PDF p.85", "originalLetter": "A", "e": "Logical changes are isolated from the users external views.", "id": "im-w4-0b90c9fa7e25"}, {"t": "mc", "q": "Which data model specifically represents entities, their attributes, and the relationships among them?", "opts": ["Relational Data Model", "Semistructured Data Model", "Entity-Relationship Model", "Object-based Data Model"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q21 · PDF p.86", "originalLetter": "C", "e": "The ER model describes entities, attributes and relationships.", "id": "im-w4-3016123025de"}, {"t": "mc", "q": "Which DBMS language category contains this SQL? CREATE TABLE student (student_id INT, student_name VARCHAR(100));", "opts": ["DML", "DDL", "DCL", "TCL"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q22 · PDF p.86", "originalLetter": "B", "e": "CREATE TABLE defines a database structure, so it is DDL.", "id": "im-w4-e702f57ddb17"}, {"t": "mc", "q": "What is the primary effect of: ALTER TABLE student ADD school_email VARCHAR(100);", "opts": ["Inserts a new student record", "Changes the structure of the existing table", "Retrieves email addresses of all students", "Grants users permission to access the table"], "a": 1, "kind": "sample", "source": "Provided answer key · Set 1 · Q23 · PDF p.86", "originalLetter": "B", "e": "ALTER TABLE ADD defines a new column.", "id": "im-w4-251525df7d18"}, {"t": "mc", "q": "A DBA wants to allow an employee to retrieve information from a table but not modify its records. Which command category assigns this privilege?", "opts": ["DDL", "DML", "DCL", "TCL"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q24 · PDF p.86", "originalLetter": "C", "e": "Privileges are controlled through DCL, for example GRANT SELECT.", "id": "im-w4-fd7a85b0623d"}, {"t": "mc", "q": "A table has 100 records. What does DELETE FROM student WHERE course = 'BSIT'; do?", "opts": ["Removes the STUDENT table", "Removes every record in STUDENT", "Removes only records satisfying the WHERE condition", "Modifies the structure of STUDENT"], "a": 2, "kind": "sample", "source": "Provided answer key · Set 1 · Q25 · PDF p.87", "originalLetter": "C", "e": "WHERE restricts the rows affected; DELETE does not drop the table.", "id": "im-w4-ff15e1102ff9"}, {"t": "mc", "q": "A developer moves records to different disk files while preserving tables and queries. Which independence applies?", "opts": ["Update anomaly", "Program-data dependence", "Physical data independence", "Logical data independence"], "a": 2, "e": "Internal storage can change without changing the conceptual schema.", "kind": "situational", "source": "PDF-based practice", "id": "im-w4-be78bc2a083e"}, {"t": "mc", "q": "A conceptual table is split while old application views still work. Which independence applies?", "opts": ["Durability", "Physical data independence only", "Data duplication", "Logical data independence"], "a": 3, "e": "Views remain stable despite changes to the conceptual schema.", "kind": "situational", "source": "PDF-based practice", "id": "im-w4-359c182471c2"}, {"t": "mc", "q": "A table must gain a date_of_birth column. Which SQL operation is appropriate?", "opts": ["ALTER TABLE", "SELECT FROM", "GRANT SELECT", "INSERT INTO"], "a": 0, "e": "Adding a column modifies structure, not just data.", "kind": "situational", "source": "PDF-based practice", "id": "im-w4-1f5f14856183"}, {"t": "mc", "q": "A clerk needs read-only access. Which command category handles that permission?", "opts": ["DML", "DDL", "DCL", "Only SELECT itself"], "a": 2, "e": "GRANT SELECT assigns permission; SELECT uses it.", "kind": "situational", "source": "PDF-based practice", "id": "im-w4-e558a124a593"}, {"t": "mc", " e simple attribute", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Derived Attribute is:", "opts": ["An attribute that cannot be divided", "An attribute whose value is calculated from other attributes", "An attribute with multiple values", "An attribute with only one value"], "a": 1, "id": "im-w5-57bb9e87c3c9", "e": "Key answer: An attribute whose value is calculated from other attributes", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which is an example of a Derived Attribute?", "opts": ["Mobile Number", "First Name + Last Name", "Social Security Number", "Age (derived from Date of Birth)"], "a": 3, "id": "im-w5-553cfc94a993", "e": "Key answer: Age (derived from Date of Birth)", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Multi-Valued Attribute is:", "opts": ["An attribute that cannot be divided", "An attribute with exactly one value", "An attribute that may contain more than one value", "An attribute derived from another"], "a": 2, "id": "im-w5-d09e34076f7f", "e": "Key answer: An attribute that may contain more than one value", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Single-Valued Attribute contains:", "opts": ["Zero values", "One value only", "Multiple values", "A calculated value"], "a": 1, "id": "im-w5-fb15f17eadfd", "e": "Key answer: One value only", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "A Relationship in ERD describes:", "opts": ["The attributes of an entity", "The association among entities", "The primary key of an entity", "The structure of a table"], "a": 1, "id": "im-w5-a856e04b0d04", "e": "Key answer: The association among entities", "kind": "recall", "source": "Original quiz bank"}, {"t": "mc", "q": "Which relationship type means \"one entity can relate to many entities\"?", "opts": ["One-to-One", "One-to-Many", "Many-to-One", "Many-to-Many"], "a": 1, "id": "im-w5-2e5671b578a2", "e": "Key answer: One-to-Many", "kind":
